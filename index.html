<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>הטיולים שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1424;--t1:#f3ecdf;--t2:#b6b0a3;--gold:#e8c882;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(110% 70% at 85% 0%,rgba(232,200,130,.18),transparent 60%),var(--bg);
  color:var(--t1);font-family:'Heebo',system-ui,sans-serif;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 48px) 16px calc(env(safe-area-inset-bottom) + 32px);flex:1;display:flex;flex-direction:column}
.kicker{font-size:13px;letter-spacing:.2em;color:var(--gold);font-weight:600}
h1{font-family:'Frank Ruhl Libre',serif;font-size:46px;line-height:1.05;font-weight:900;margin-top:12px}
.sub{color:var(--t2);margin-top:10px;font-size:16px}
.list{display:flex;flex-direction:column;gap:16px;margin-top:36px}
.trip{position:relative;display:block;height:200px;border-radius:26px;overflow:hidden;text-decoration:none;color:#fff;
  box-shadow:0 18px 40px rgba(0,0,0,.4);transform:translateY(16px);opacity:0;animation:up .7s var(--ease) forwards;transition:transform .3s var(--ease)}
.trip:nth-child(2){animation-delay:.08s}
.trip:active{transform:scale(.98)}
@keyframes up{to{transform:none;opacity:1}}
.trip .bg{position:absolute;inset:0}
.trip .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent 65%)}
.trip .flag{position:absolute;top:18px;right:20px;font-size:30px}
.trip .status{position:absolute;top:22px;left:20px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.trip .txt{position:absolute;right:22px;left:22px;bottom:20px}
.trip h2{font-family:'Frank Ruhl Libre',serif;font-size:36px;font-weight:900;line-height:1}
.trip p{margin-top:6px;font-size:14px;opacity:.85}
.trip .go{position:absolute;left:20px;bottom:22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);font-size:20px}
.bud .bg{background:radial-gradient(90% 120% at 20% 10%,#f0c870 0%,transparent 55%),linear-gradient(135deg,#7a3b1f,#1a2c52 70%)}
.kor .bg{background:radial-gradient(90% 120% at 20% 10%,#ff8fb8 0%,transparent 55%),linear-gradient(135deg,#3b2a7a,#0e1d3a 70%)}
.bud .status{background:var(--gold);color:#1b1407}
.deco{position:absolute;inset:auto -10px -6px auto;font-size:140px;opacity:.13;line-height:1}
footer{margin-top:auto;padding-top:32px;text-align:center;color:var(--t2);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">OUR TRIPS</div>
  <h1>לאן<br>טסים?</h1>
  <p class="sub">בוחרים טיול ונכנסים.</p>

  <div class="list">
    <a class="trip bud" href="budapest/">
      <div class="bg"></div><div class="deco">🏰</div><div class="shade"></div>
      <div class="flag">🇭🇺</div>
      <div class="status" id="budStatus">הטיול הבא</div>
      <div class="txt"><h2>בודפשט</h2><p id="budDates"></p></div>
      <div class="go">←</div>
    </a>
    <a class="trip kor" href="korea/">
      <div class="bg"></div><div class="deco">🏯</div><div class="shade"></div>
      <div class="flag">🇰🇷</div>
      <div class="status">אפריל 2026</div>
      <div class="txt"><h2>קוריאה</h2><p>סיאול · ג׳ג׳ו · בוסאן</p></div>
      <div class="go">←</div>
    </a>
  </div>

  <footer>משה ופס ✈️</footer>
</div>

<script src="budapest/trip.js"></script>
<script>
// התאריכים של בודפשט נמשכים מ-budapest/trip.js, כך שמעדכנים אותם רק במקום אחד
(function () {
  const T = window.TRIP; if (!T) return;
  const MON = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
  const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) };
  const s = D(T.start), e = D(T.end);
  document.getElementById('budDates').textContent = `${s.getDate()} עד ${e.getDate()} ${MON[e.getMonth()]} ${e.getFullYear()}`;
  const days = Math.ceil((s - new Date()) / 864e5);
  document.getElementById('budStatus').textContent = days > 0 ? `עוד ${days} ימים` : (new Date() <= e ? 'עכשיו!' : 'היה מושלם');
})();
</script>
</body>
</html>
