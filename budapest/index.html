<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>בודפשט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1424;--bg2:#111d33;--card:#15233d;--card2:#1b2c4b;
  --line:rgba(232,200,130,.14);--line2:rgba(255,255,255,.08);
  --t1:#f3ecdf;--t2:#b6b0a3;--t3:#7a7f8c;
  --gold:#e8c882;--gold2:#c9a35a;--paprika:#d9573b;--danube:#4f8fc0;--green:#6fbf8e;
  --sh:0 10px 30px rgba(0,0,0,.35);
  --r:20px;--ease:cubic-bezier(.16,1,.3,1);
  --nav-h:72px;
}
:root[data-theme=light]{
  --bg:#f6f1e7;--bg2:#efe7d8;--card:#fffdf8;--card2:#f7f0e3;
  --line:rgba(150,110,40,.18);--line2:rgba(0,0,0,.07);
  --t1:#1b2333;--t2:#55596a;--t3:#8f8a80;
  --gold:#a8782a;--gold2:#8a6020;--paprika:#c2452b;--danube:#2f6f9f;--green:#3f8f60;
  --sh:0 8px 24px rgba(60,40,10,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);font-family:'Google Sans',system-ui,sans-serif;min-height:100vh;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transition:background .3s,color .3s}
h1,h2,h3,.serif{font-family:'Google Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ── Hero ── */
.hero{position:relative;overflow:hidden;padding:calc(env(safe-area-inset-top) + 28px) 0 30px;
  background:radial-gradient(120% 90% at 80% 0%,rgba(232,200,130,.22),transparent 60%),
             linear-gradient(180deg,#0e1a30 0%,var(--bg) 100%)}
:root[data-theme=light] .hero{background:radial-gradient(120% 90% at 80% 0%,rgba(232,170,80,.28),transparent 60%),linear-gradient(180deg,#efe2c8,var(--bg))}
.skyline{position:absolute;inset:auto 0 0 0;width:100%;height:90px;pointer-events:none;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
.skyline path{fill:var(--gold);opacity:.07}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.kicker{font-size:13px;letter-spacing:.18em;color:var(--gold);font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--line2);border:1px solid var(--line2);font-size:18px}
.hero h1{font-size:56px;line-height:1;font-weight:900;margin-top:14px;letter-spacing:-.01em}
.hero h1 span{color:var(--gold)}
.hero .dates{color:var(--t2);margin-top:8px;font-size:15px}
.count{display:flex;gap:10px;margin-top:22px;position:relative;z-index:1}
.count div{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;backdrop-filter:blur(8px)}
:root[data-theme=light] .count div{background:rgba(255,255,255,.6)}
.count b{display:block;font-family:'Google Sans',system-ui,sans-serif;font-size:28px;color:var(--gold)}
.count small{color:var(--t2);font-size:12px}
.today-banner{margin-top:22px;background:var(--gold);color:#1b1407;border-radius:16px;padding:14px 16px;font-weight:600;position:relative;z-index:1}

/* ── Sections ── */
.page{display:none;animation:in .45s var(--ease)}
.page.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec-title{font-size:26px;font-weight:700;margin:26px 0 14px}
.sec-title small{display:block;font-family:'Google Sans',system-ui,sans-serif;font-size:14px;color:var(--t3);font-weight:400;margin-top:2px}

/* day chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;min-width:68px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line2);text-align:center;transition:.25s var(--ease)}
.chip .wd{font-size:12px;color:var(--t3)}
.chip .dn{font-family:'Google Sans',system-ui,sans-serif;font-size:22px;font-weight:700}
.chip.on{background:var(--gold);color:#1b1407;border-color:transparent}
.chip.on .wd{color:#5a4410}
.chip.is-today:not(.on){border-color:var(--gold)}

.day-head{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px}
.day-head h2{font-size:24px}
.day-head span{color:var(--t3);font-size:14px}

/* timeline */
.tl{position:relative;margin-top:10px}
.tl::before{content:'';position:absolute;top:8px;bottom:8px;right:27px;width:2px;background:linear-gradient(var(--gold),transparent)}
.ev{position:relative;display:flex;gap:14px;margin-bottom:12px}
.ev .dot{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1}
.ev .dot i{font-style:normal;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--card2);border:1px solid var(--line)}
.ev .dot b{font-size:12px;color:var(--gold);font-weight:600;background:var(--bg);padding:2px 4px;border-radius:6px}
.ev .body{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.ev h3{font-family:'Google Sans',system-ui,sans-serif;font-size:16px;font-weight:600}
.ev p{color:var(--t2);font-size:14px;line-height:1.55;margin-top:4px}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;margin-top:8px;margin-left:6px;border:1px solid currentColor;opacity:.9}
.tag.food{color:var(--paprika)}.tag.sight{color:var(--gold)}.tag.bath{color:var(--danube)}
.tag.night{color:#b48ad8}.tag.move{color:var(--t3)}.tag.shop{color:var(--green)}
.maplink{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-top:8px;color:var(--danube);text-decoration:none;font-weight:500}

/* cards */
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.flight{display:flex;align-items:center;gap:14px}
.flight .ap{font-family:'Google Sans',system-ui,sans-serif;font-size:26px;font-weight:700}
.flight .mid{flex:1;text-align:center;color:var(--t3);font-size:12px;position:relative}
.flight .mid::before{content:'';position:absolute;top:50%;left:0;right:0;border-top:1px dashed var(--line)}
.flight .mid span{position:relative;background:var(--card);padding:0 8px}
.meta{display:flex;justify-content:space-between;color:var(--t2);font-size:13px;margin-top:10px}
.lbl{font-size:12px;color:var(--gold);letter-spacing:.08em;font-weight:600;margin-bottom:6px}

/* map */
#map{position:sticky;top:8px;z-index:5;height:40vh;min-height:280px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line2);background:var(--bg2);box-shadow:var(--sh)}
#map iframe{width:100%;height:100%;border:0;display:block}
.map-bar{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.map-bar b{flex:1;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-bar a{padding:8px 14px;border-radius:99px;background:var(--gold);color:#1b1407;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.legend{margin-top:6px}
.mp{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 4px;border-bottom:1px solid var(--line2)}
.mp i{font-style:normal;font-size:18px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:0 0 auto}
.mp span{flex:1;font-size:15px}
.mp small{color:var(--t3);font-size:12px}
.mp.on span{color:var(--gold);font-weight:600}
.mp.on i{background:var(--gold)}

/* reels */
.reel-frame{width:100%;height:calc(100vh - 230px);min-height:420px;border:0;border-radius:var(--r);background:#000}
.empty{text-align:center;padding:40px 20px;color:var(--t2)}

/* checklist */
.chk{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.chk .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--gold2);display:grid;place-items:center;flex:0 0 auto;transition:.2s}
.chk.done .box{background:var(--gold);border-color:var(--gold)}
.chk.done .box::after{content:'✓';color:#1b1407;font-weight:700;font-size:14px}
.chk.done span{color:var(--t3);text-decoration:line-through}
.progress{height:6px;border-radius:9px;background:var(--line2);overflow:hidden;margin-bottom:8px}
.progress div{height:100%;background:var(--gold);transition:width .4s var(--ease)}

/* tips & phrases */
.tip{display:flex;gap:14px}
.tip .ico{font-size:26px}
.tip h3{font-family:'Google Sans',system-ui,sans-serif;font-size:16px;font-weight:600}
.tip p{color:var(--t2);font-size:14px;line-height:1.6;margin-top:2px}
.ph{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px}
.ph .hu{font-family:'Google Sans',system-ui,sans-serif;font-size:20px;direction:ltr;text-align:left;color:var(--gold)}
.ph .say{color:var(--t3);font-size:13px}

/* places */
.search{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--line2);background:var(--card);color:var(--t1);font:inherit;font-size:15px;outline:none;margin-bottom:12px}
.search:focus{border-color:var(--gold)}
.pl-chips .chip{min-width:auto;display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:14px;font-weight:500}
.pl-filters{display:flex;gap:8px;margin:6px 0 14px}
.pill{padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line2);font-size:13px}
.pill.on{background:var(--gold);color:#1b1407;border-color:transparent}
.cat-h{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px}
.cat-h h3{font-size:19px;font-weight:700}
.cat-h span{color:var(--t3);font-size:13px}
.pl{position:relative;padding:14px 16px 12px}
.pl h4{font-size:16px;font-weight:600;padding-left:40px}
.pl .en{direction:ltr;text-align:right;color:var(--t3);font-size:12px;margin-top:1px}
.pl p{color:var(--t2);font-size:14px;line-height:1.55;margin-top:6px}
.pl .row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
.badge.rec{background:var(--gold);color:#1b1407}
.badge.t{border:1px solid var(--line);color:var(--t2)}
.fav{position:absolute;top:10px;left:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--t3);background:var(--line2)}
.fav.on{color:var(--paprika)}
.empty-day{text-align:center;padding:28px 20px;color:var(--t2);line-height:1.6}
.empty-day button{margin-top:12px;padding:10px 18px;border-radius:99px;background:var(--gold);color:#1b1407;font-weight:600}

/* reels */
.reel-row{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.reel-row::-webkit-scrollbar{display:none}
.reel-th{flex:0 0 auto;width:64px;height:96px;border-radius:12px;background:var(--card2) center/cover;position:relative;border:1px solid var(--line)}
.reel-th::after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:18px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.badge.new{background:var(--paprika);color:#fff}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);z-index:1200;max-width:600px;margin:0 auto;
  background:var(--gold);color:#1b1407;border-radius:16px;padding:13px 16px;font-weight:600;box-shadow:var(--sh);transform:translateY(20px);opacity:0;pointer-events:none;transition:.3s var(--ease)}
.toast.on{transform:none;opacity:1}
.viewer{position:fixed;inset:0;z-index:1300;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 50px) 16px calc(env(safe-area-inset-bottom) + 20px)}
.viewer[hidden]{display:none}
.viewer video{max-width:100%;max-height:78vh;border-radius:16px;background:#000}
.viewer-x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:18px}
.viewer-cap{display:flex;gap:12px;align-items:center;margin-top:12px;color:#fff}
.viewer-cap a{color:var(--gold);font-size:14px}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line2)}
nav .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--t3);padding:6px 4px;min-width:52px;border-radius:14px;transition:.2s}
nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7;transition:.2s}
nav button.on{color:var(--gold)}
nav button.on i{filter:none;opacity:1;transform:translateY(-2px)}
</style>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="טיולים">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <a href="../" class="icon-btn" aria-label="כל הטיולים" style="text-decoration:none">→</a>
      <div class="kicker" id="kicker" style="flex:1;margin-right:12px">BUDAPEST</div>
      <button class="icon-btn" id="themeBtn" aria-label="מצב תצוגה">🌙</button>
    </div>
    <h1 id="title"></h1>
    <div class="dates" id="dates"></div>
    <div class="count" id="count"></div>
  </div>
</header>

<main class="wrap">
  <section class="page on" id="p-plan">
    <div class="chips" id="chips"></div>
    <div id="day"></div>
  </section>

  <section class="page" id="p-places">
    <h2 class="sec-title">מקומות<small id="plSub"></small></h2>
    <input id="plSearch" class="search" type="search" placeholder="חיפוש מקום, מסעדה, בר...">
    <div class="chips pl-chips" id="plCats"></div>
    <div class="pl-filters">
      <button id="plRec" class="pill">⭐ רק מומלצים</button>
      <button id="plFav" class="pill">♥ שמרנו</button>
      <button id="plAddReel" class="pill">🎬 הוספת ריל</button>
    </div>
    <div id="plList"></div>
  </section>

  <section class="page" id="p-map">
    <h2 class="sec-title">המפה שלנו<small>בוחרים מקום מהרשימה והוא מופיע במפה</small></h2>
    <div id="map"></div>
    <div class="map-bar"><b id="mapName"></b><a id="mapOpen" target="_blank" rel="noopener">פתח בגוגל מפות</a></div>
    <div class="chips pl-chips legend" id="legend"></div>
    <div id="mapList"></div>
  </section>

  <section class="page" id="p-reels">
    <h2 class="sec-title">ריילים<small>הגלובוס עם הסרטונים מאינסטגרם</small></h2>
    <div id="reels"></div>
  </section>

  <section class="page" id="p-info">
    <h2 class="sec-title">טיסות</h2>
    <div id="flights"></div>
    <h2 class="sec-title">מלונות</h2>
    <div id="hotels"></div>
    <h2 class="sec-title">לפני שיוצאים<small id="chkSub"></small></h2>
    <div class="progress"><div id="chkBar"></div></div>
    <div id="checks"></div>
    <h2 class="sec-title">טיפים</h2>
    <div id="tips"></div>
    <h2 class="sec-title">הונגרית בסיסית</h2>
    <div class="card" id="phrases"></div>
  </section>
</main>

<div id="toast" class="toast"></div>
<div id="viewer" class="viewer" hidden>
  <button class="viewer-x" aria-label="סגירה">✕</button>
  <video id="viewerVideo" playsinline controls></video>
  <div class="viewer-cap"><b id="viewerTitle"></b><a id="viewerIg" target="_blank" rel="noopener">באינסטגרם ↗</a></div>
</div>

<nav><div class="in" id="nav">
  <button data-p="plan" class="on"><i>📅</i>לו״ז</button>
  <button data-p="places"><i>📍</i>מקומות</button>
  <button data-p="map"><i>🗺️</i>מפה</button>
  <button data-p="reels"><i>🌍</i>ריילים</button>
  <button data-p="info"><i>🧳</i>מידע</button>
</div></nav>

<script src="trip.js"></script>
<script src="places.js"></script>
<script>
const T = window.TRIP;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
};
const WD = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MON = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
const D = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d) };
const fmt = s => { const d = D(s); return `${d.getDate()} ${MON[d.getMonth()]}` };
const todayStr = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` })();
const gmaps = (lat, lng, q) => lat ? `https://www.google.com/maps/search/?api=1&query=${lat},${lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const TAGS = { food:'אוכל', sight:'אטרקציה', bath:'מרחצאות', night:'לילה', move:'תנועה', shop:'קניות' };

/* theme */
const applyTheme = t => { document.documentElement.dataset.theme = t; $('#themeBtn').textContent = t === 'light' ? '🌙' : '☀️'; store.set('theme', t) };
applyTheme(store.get('theme', 'dark'));
$('#themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

/* hero */
$('#title').innerHTML = `${esc(T.title)} <span>${D(T.start).getFullYear()}</span>`;
$('#dates').textContent = `${fmt(T.start)} עד ${fmt(T.end)} · ${T.travelers.join(' ו')}`;
function renderCount() {
  const now = new Date(), start = D(T.start), end = D(T.end); end.setHours(23,59);
  if (now < start) {
    const ms = start - now, d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60;
    $('#count').innerHTML = [[d,'ימים'],[h,'שעות'],[m,'דקות']].map(([n,l]) => `<div><b>${n}</b><small>${l}</small></div>`).join('');
  } else if (now <= end) {
    const n = T.days.findIndex(x => x.date === todayStr) + 1;
    $('#count').innerHTML = `<div class="today-banner" style="flex:1">אנחנו בבודפשט! יום ${n || ''} מתוך ${T.days.length}</div>`;
  } else {
    $('#count').innerHTML = `<div style="flex:1"><small>היה מושלם 💛</small></div>`;
  }
}
renderCount(); setInterval(renderCount, 30000);

/* schedule */
let curDay = Math.max(0, T.days.findIndex(d => d.date === todayStr));
function renderChips() {
  $('#chips').innerHTML = T.days.map((d, i) => `
    <button class="chip ${i === curDay ? 'on' : ''} ${d.date === todayStr ? 'is-today' : ''}" data-i="${i}">
      <div class="wd">יום ${WD[D(d.date).getDay()]}</div><div class="dn">${D(d.date).getDate()}</div>
    </button>`).join('');
}
function renderDay() {
  const d = T.days[curDay];
  $('#day').innerHTML = `

/* Full Google map with every pin. Turned on by googleMapsKey in trip.js. */
const GM = {
  map: null, markers: [], info: null,
  load() {
    window.__gmReady = () => GM.init();
    const sc = document.createElement('script');
    sc.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(T.googleMapsKey)}&language=iw&region=HU&callback=__gmReady`;
    sc.async = true; sc.onerror = () => showOnMap(mapEntries()[0]);
    document.head.appendChild(sc);
  },
  init() {
    const dark = document.documentElement.dataset.theme !== 'light';
    $('#map').innerHTML = '';
    GM.map = new google.maps.Map($('#map'), {
      center: { lat: T.center[0], lng: T.center[1] }, zoom: 14, disableDefaultUI: true, zoomControl: true, gestureHandling: 'greedy',
      colorScheme: dark ? 'DARK' : 'LIGHT', clickableIcons: false,
    });
    GM.info = new google.maps.InfoWindow();
    const cache = store.get('geo', {}), geocoder = new google.maps.Geocoder(), todo = [];
    mapEntries().forEach(e => {
      const pos = e.lat ? { lat: e.lat, lng: e.lng } : cache[e.en];
      if (pos) GM.add(e, pos); else todo.push(e);
    });
    // Places without coordinates are looked up once and remembered on this phone
    const next = () => {
      const e = todo.shift(); if (!e) return;
      geocoder.geocode({ address: e.en, bounds: { north: 47.62, south: 47.40, east: 19.25, west: 18.92 } }, (r, st) => {
        if (st === 'OK' && r[0]) { const l = r[0].geometry.location, pos = { lat: l.lat(), lng: l.lng() }; cache[e.en] = pos; store.set('geo', cache); GM.add(e, pos); GM.filter() }
        setTimeout(next, 120);
      });
    };
    next();
    renderMapList(); GM.filter();
    $('#mapName').textContent = 'כל המקומות'; $('#mapOpen').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(T.hotels[0]?.addr || 'Budapest')}`;
  },
  add(e, pos) {
    const color = e.cat === 'hotel' ? '#4f8fc0' : e.rec ? '#e8c882' : '#f3ecdf';
    const m = new google.maps.Marker({ map: GM.map, position: pos, title: e.name,
      label: { text: e.icon, fontSize: '15px' },
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 15, fillColor: color, fillOpacity: 1, strokeColor: '#0b1424', strokeWeight: 2 } });
    m.entry = e; m.addListener('click', () => showOnMap(e));
    GM.markers.push(m);
  },
  filter() {
    if (!GM.map) return;
    GM.markers.forEach(m => m.setVisible(mapCat === 'all' || m.entry.cat === mapCat || m.entry.cat === 'hotel'));
  },
  focus(e) {
    const m = GM.markers.find(x => x.entry.name === e.name);
    const q = encodeURIComponent(mapQ(e));
    $('#mapName').textContent = `${e.icon} ${e.name}`;
    $('#mapOpen').href = `https://www.google.com/maps/search/?api=1&query=${q}`;
    if (!m) return;
    GM.map.panTo(m.getPosition()); if (GM.map.getZoom() < 15) GM.map.setZoom(15);
    GM.info.setContent(`<div dir="rtl" style="font-family:'Google Sans',sans-serif;color:#1b2333"><b>${esc(e.name)}</b><br><small>${esc(e.sub)}</small><br><a target="_blank" href="https://www.google.com/maps/search/?api=1&query=${q}">ניווט</a></div>`);
    GM.info.open({ map: GM.map, anchor: m });
  },
};

/* ── Reels shared from Instagram (server: ReelGlobe's Supabase) ── */
const RG = T.reelglobe || {}, RG_ON = !!(RG.api && RG.anonKey);
const BUD_BOX = { min_lat: 47.35, max_lat: 47.65, min_lng: 18.90, max_lng: 19.35 };
const CAT_MAP = { food: 'food', cafe: 'cafes', sight: 'sights', night: 'night', nature: 'sights', stay: 'fun', other: 'fun' };
REELS = store.get('reels', []);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\u0590-\u05ff]+/g, ' ').trim();
function sameSpot(it, r) {
  if (it.lat && r.lat && Math.hypot(it.lat - r.lat, (it.lng - r.lng) * 0.67) < 0.0015) return true;   // about 150 m
  const a = norm(String(r.place || '').split(',')[0]);
  if (a.length < 4) return false;
  return [it.en, it.name].some(n => { const b = norm(String(n).replace(/budapest/i, '')); return b.length >= 4 && (b.includes(a) || a.includes(b)) });
}
// The static list from places.js, plus every Budapest reel: attached to the place it shows, or added as a new place
function placesWithReels() {
  const P = (window.PLACES || []).map(c => ({ ...c, items: c.items.map(it => ({ ...it, reels: [] })) }));
  for (const r of REELS) {
    let hit = null;
    for (const c of P) { hit = c.items.find(it => sameSpot(it, r)); if (hit) break }
    if (hit) { hit.reels.push(r); if (!hit.lat && r.precise) { hit.lat = r.lat; hit.lng = r.lng } continue }
    const cat = P.find(c => c.id === (CAT_MAP[r.cat] || 'fun')) || P[0];
    cat.items.unshift({ name: r.title || r.place, en: String(r.place || '').split(',')[0], desc: r.place || '', lat: r.lat, lng: r.lng, reels: [r], fromReel: true });
  }
  return P;
}
async function loadReels() {
  if (!RG_ON) return;

    const res = await fetch(RG.api + '/rest/v1/rpc/reels_in_view', { method: 'POST',
      headers: { apikey: RG.anonKey, Authorization: 'Bearer ' + RG.anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...BUD_BOX, lim: 500 }) });
    if (!res.ok) return;
    REELS = await res.json(); store.set('reels', REELS); renderPlaces();
  } catch {}
}

const say = (t, ms = 6000) => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(say.t); say.t = setTimeout(() => el.classList.remove('on'), ms) };
async function shareApi(body) {

// a few still pictures from the stored video, for Claude to look at when the text does not say where it was filmed
async function framesOf(src, n = 5) {
  const v = document.createElement('video'); v.crossOrigin = 'anonymous'; v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = src;
  await new Promise((ok, no) => { v.onloadeddata = ok; v.onerror = no; setTimeout(no, 25000) });
  const k = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  const out = [];
  for (let i = 0; i < n; i++) {
    v.currentTime = v.duration * (i + .5) / n; await new Promise(ok => { v.onseeked = ok; setTimeout(ok, 6000) });
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); out.push(c.toDataURL('image/jpeg', .7).split(',')[1]);
  }
  v.removeAttribute('src'); v.load();
  return out;
}
async function takeShared(link) {
  if (!RG_ON) return say('שיתוף ריילים עוד לא מחובר לשרת');
  go('places'); say('שומר את הריל ומזהה את המקום…', 90000);
  try {
    let o = await shareApi({ url: link }), looked = false;
    while (o.needs) {
      if (o.needs === 'username') return say('לא הצלחתי לקרוא את הריל. אולי החשבון פרטי?');
      if (o.video && !looked) {
        looked = true; say('מזהה את המקום מתוך הסרטון…', 90000);
        try { o = await shareApi({ id: o.id, frames: await framesOf(o.video) }); continue } catch {}
      }
      const where = prompt(o.error ? 'לא מצאתי את המקום הזה. נסו שם אחר' : 'איפה צולם הריל? (שם המקום בבודפשט)');
      if (!where) return say('הריל נשמר, אבל עוד בלי מקום');
      say('ממקם…', 90000); o = await shareApi({ id: o.id, place: where.includes('Budapest') ? where : where + ', Budapest' });
    }
    if (!o.reel) return say(o.error === 'full' ? 'האחסון של הריילים מלא' : o.error === 'busy' ? 'אינסטגרם עמוסה כרגע. נסו שוב עוד כמה דקות' : 'לא הצלחתי לשמור את הריל');
    const r = o.reel;
    if (r.lat < BUD_BOX.min_lat || r.lat > BUD_BOX.max_lat || r.lng < BUD_BOX.min_lng || r.lng > BUD_BOX.max_lng) return say(`הריל נשמר ב-ReelGlobe, אבל הוא לא בבודפשט (${r.city || r.place})`);
    REELS = [r, ...REELS.filter(x => x.id !== r.id)]; store.set('reels', REELS);
    plCat = 'all'; plQ = ''; $('#plSearch').value = ''; renderPlaces();
    const found = placesWithReels().flatMap(c => c.items).find(it => it.reels.some(x => x.id === r.id));
    say(found && !found.fromReel ? `הסרטון נוסף ל"${found.name}"` : `נוסף מקום חדש: ${r.title || r.place}`);
    setTimeout(() => document.querySelector(`[data-reel="${CSS.escape(r.id)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
  } catch { say('לא הצלחתי לשמור את הריל') }
}

};
