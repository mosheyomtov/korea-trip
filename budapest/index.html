<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>בודפשט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" rel="stylesheet">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="טיולים">
<style>
/* Journi's look: light surfaces, one blue accent, soft shadows, pill controls */
:root{
  --bg:#F7F8FA;--surface:#fff;--surface-2:#F2F3F7;--surface-3:#EAECF2;--border:#E8EAF0;--border-2:#D8DBE6;
  --ink:#0D0E14;--ink-2:#3D3F52;--ink-3:#7E8099;--ink-4:#BABCCF;
  --brand:#3B6EF5;--brand-light:#EEF2FE;--brand-dark:#2952CC;
  --green:#22C55E;--green-light:#EDFBF3;--amber:#F59E0B;--amber-light:#FFFBEB;--rose:#F43F5E;--rose-light:#FFF1F3;--violet:#8B5CF6;--violet-light:#F5F3FF;
  --sh-sm:0 1px 3px rgba(13,14,20,.06),0 1px 2px rgba(13,14,20,.04);
  --sh-md:0 4px 16px rgba(13,14,20,.08),0 2px 6px rgba(13,14,20,.04);
  --sh-lg:0 16px 48px rgba(13,14,20,.12),0 4px 16px rgba(13,14,20,.06);
  --r-sm:10px;--r:16px;--r-lg:22px;--r-xl:28px;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Google Sans',system-ui,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle}
.ms.fill{font-variation-settings:'FILL' 1}

/* screens */
.screen{display:none;min-height:100vh;padding-bottom:calc(110px + var(--bot))}
.screen.on{display:block;animation:fadeUp .4s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

/* app bar (Journi) */
.app-bar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:.5px solid rgba(60,60,67,.1);padding:calc(var(--top) + 10px) 0 10px}
.app-bar .wrap{display:flex;align-items:center;gap:10px}
.app-bar h1{font-size:20px;font-weight:700;letter-spacing:-.4px;flex:1}
.app-bar h1 small{display:block;font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-top:1px}
.circle{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;color:#1D1D1F;flex:0 0 auto;transition:transform .12s}
.circle:active{transform:scale(.88)}
.app-bar .circle{box-shadow:none;background:var(--surface-2)}

/* hero card (countdown) */
.hero{margin:18px 0 6px;border-radius:var(--r-lg);padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#3B6EF5 0%,#5B8CFF 60%,#7FA6FF 100%);box-shadow:0 10px 30px rgba(59,110,245,.28)}
.hero::after{content:'';position:absolute;left:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .k{font-size:13px;opacity:.85}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.hero .row{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.hero .row div{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 4px;text-align:center}
.hero .row b{display:block;font-size:22px}
.hero .row small{font-size:11px;opacity:.9}

/* section header */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px}
.sec h2{font-size:17px;font-weight:700;letter-spacing:-.4px}
.sec span{font-size:13px;color:var(--ink-3)}

/* day pills (Journi) */
.day-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 20px 8px;margin:0 -20px}
.day-pills::-webkit-scrollbar{display:none}
.day-pill{flex:0 0 auto;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;text-align:center;min-width:64px;transition:all .2s var(--spring)}
.day-pill:active{transform:scale(.94)}
.day-pill .n{font-size:11px;color:var(--ink-4);display:block;font-weight:600}
.day-pill .d{font-size:16px;font-weight:700;color:var(--ink);display:block;margin:2px 0}
.day-pill .l{font-size:9px;color:var(--ink-3);display:block;font-weight:600}
.day-pill.on{background:var(--brand);border-color:var(--brand);box-shadow:0 6px 20px rgba(59,110,245,.28);transform:translateY(-2px)}
.day-pill.on *{color:#fff}
.day-pill.today:not(.on){border-color:var(--brand)}

.day-head{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.day-head h3{font-size:20px;font-weight:700;letter-spacing:-.4px;flex:1}
.day-head span{font-size:13px;color:var(--ink-3)}

/* AI button + info blocks */
.ai-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,#F5F3FF,#EEF2FE);border:1.5px solid rgba(139,92,246,.18);text-align:right;margin-top:14px}
.ai-btn .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#8B5CF6,#3B6EF5);color:#fff;flex:0 0 auto}
.ai-btn b{display:block;font-size:15px}
.ai-btn small{color:var(--ink-3);font-size:12.5px}
.info-block{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;line-height:1.65}
.info-lbl{font-size:11px;font-weight:700;letter-spacing:.4px;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.info-lbl .ms{font-size:16px}
.ib-nav{background:rgba(59,110,245,.05);border:1px solid rgba(59,110,245,.12);color:var(--ink-2)}
.ib-nav .info-lbl{color:var(--brand)}
.ib-ai{background:var(--violet-light);border:1px solid rgba(139,92,246,.18);color:var(--ink-2)}
.ib-ai .info-lbl{color:var(--violet)}
.ib-tip{background:var(--green-light);border:1px solid rgba(34,197,94,.18);color:var(--ink-2)}
.ib-tip .info-lbl{color:#15803d}

/* timeline (Journi) */
.timeline{position:relative;padding-right:26px}
.timeline::before{content:'';position:absolute;top:0;bottom:0;right:5px;width:2px;background:linear-gradient(180deg,var(--brand) 0%,rgba(59,110,245,.1) 100%);border-radius:2px}
.tl-item{position:relative;margin-bottom:6px;animation:slideIn .35s var(--ease) backwards}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.tl-dot{position:absolute;right:-26px;top:18px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--brand);box-shadow:0 0 0 3px rgba(59,110,245,.12);z-index:2}
.tl-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh-sm);transition:all .2s var(--ease)}
.tl-card.open{border-color:rgba(59,110,245,.35);box-shadow:0 0 0 4px rgba(59,110,245,.06),var(--sh-sm)}
.tl-top{display:flex;align-items:center;gap:10px}
.tl-time{font-size:12px;font-weight:700;color:var(--brand);min-width:40px;font-variant-numeric:tabular-nums}
.tl-emoji{font-size:19px;width:24px;text-align:center}
.tl-name{font-size:14.5px;font-weight:600;flex:1;line-height:1.35}
.tl-chev{color:var(--ink-4);transition:transform .25s}
.tl-card.open .tl-chev{transform:rotate(90deg);color:var(--brand)}
.tl-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.tl-card.open .tl-body{display:block;animation:expand .25s var(--ease)}
@keyframes expand{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tl-desc{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:99px;font-size:13px;font-weight:600;background:var(--brand-light);color:var(--brand)}
.act .ms{font-size:17px}
.act.ghost{background:var(--surface-2);color:var(--ink-2)}
.act.dark{background:var(--ink);color:#fff}
.act.rose{background:var(--rose-light);color:var(--rose)}

/* empty */
.empty{text-align:center;padding:34px 20px;border:1.5px dashed var(--border-2);border-radius:var(--r-lg);color:var(--ink-3);font-size:13.5px;line-height:1.6;background:#fff}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty .ms{font-size:38px;color:var(--ink-4);margin-bottom:8px}

/* pills / chips */
.pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block}
.p-blue{background:var(--brand-light);color:var(--brand)}.p-green{background:var(--green-light);color:#15803d}
.p-amber{background:var(--amber-light);color:#b45309}.p-rose{background:var(--rose-light);color:var(--rose)}
.p-violet{background:var(--violet-light);color:var(--violet)}.p-gray{background:var(--surface-2);color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 20px 6px;margin:0 -20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--border);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* places */
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:0 14px;margin:16px 0 12px}
.search input{flex:1;border:0;outline:0;background:none;padding:12px 0;font-size:15px;color:var(--ink)}
.search .ms{color:var(--ink-3)}
.filters{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.cat-h{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px}
.cat-h h3{font-size:17px;font-weight:700;letter-spacing:-.3px}
.cat-h span{color:var(--ink-3);font-size:12.5px}
.pl{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh-sm);position:relative}
.pl h4{font-size:15.5px;font-weight:600;padding-left:44px;line-height:1.35}
.pl .en{direction:ltr;text-align:right;color:var(--ink-3);font-size:12px;margin-top:1px;padding-left:44px}
.pl p{color:var(--ink-2);font-size:13.5px;line-height:1.6;margin-top:7px}
.pl .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.fav{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);transition:transform .2s var(--spring)}
.fav.on{background:var(--rose-light);color:var(--rose)}
.fav:active{transform:scale(.85)}
.reel-row{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
.reel-row::-webkit-scrollbar{display:none}
.th{flex:0 0 auto;width:72px;height:108px;border-radius:12px;background:var(--surface-3) center/cover;position:relative;overflow:hidden;box-shadow:var(--sh-sm)}
.th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.th::after{content:'play_arrow';font-family:'Material Symbols Rounded';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;text-shadow:0 1px 8px rgba(0,0,0,.5);font-variation-settings:'FILL' 1}
.th .src{position:absolute;bottom:4px;right:4px;z-index:1;font-size:9px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 5px}
.pending{background:var(--amber-light);border:1px solid rgba(245,158,11,.25);border-radius:var(--r);padding:12px 14px;margin-top:12px;font-size:13.5px}
.pending .r{display:flex;gap:8px;margin-top:8px}
.pending input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;background:#fff;outline:0}

/* MAP screen: full bleed, no frame */
#s-map{padding:0;min-height:0}
#mapWrap{position:fixed;inset:0;background:#e8eaf0}
#gmap{width:100%;height:100%}
#gmap iframe{width:100%;height:100%;border:0}
.map-top{position:fixed;top:calc(var(--top) + 12px);left:12px;right:12px;z-index:40;display:flex;align-items:center;gap:8px;pointer-events:none}
.map-top > *{pointer-events:auto}
.seg{flex:1;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:99px;padding:5px;box-shadow:0 4px 24px rgba(0,0,0,.14)}
.seg button{flex:1;padding:9px 6px;border-radius:99px;font-size:14px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:5px;transition:.2s}
.seg button .ms{font-size:18px}
.seg button.on{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(59,110,245,.35)}
.map-chips{position:fixed;top:calc(var(--top) + 70px);left:0;right:0;z-index:39;padding:0 12px}
.map-chips .chips{margin:0;padding:2px 0 6px}
.map-chips .chip{box-shadow:0 2px 10px rgba(0,0,0,.1);border-color:transparent}
.strip{position:fixed;left:0;right:0;bottom:calc(92px + var(--bot));z-index:38;display:flex;gap:10px;overflow-x:auto;padding:4px 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .th{width:84px;height:126px;border:2px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.2)}
/* markers */
.mk{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:transform .2s var(--spring)}
.mk:hover,.mk.sel{transform:translate(-50%,-100%) scale(1.15);z-index:5}
.mk .pin{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid #1a1a2e;display:grid;place-items:center;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.mk.fv .pin{border-color:var(--rose);box-shadow:0 0 0 3px rgba(244,63,94,.25),0 3px 10px rgba(0,0,0,.25)}
.mk.rl .pin{border-color:var(--brand)}
.mk.hotel .pin{background:var(--brand);color:#fff;border-color:#fff}
.mk .bub{width:46px;height:58px;border-radius:12px;border:2.5px solid #fff;background:var(--brand) center/cover;box-shadow:0 4px 14px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-size:20px;overflow:hidden}
.mk .bub video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.mk .n{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;z-index:300;background:rgba(13,14,20,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:301;background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-lg);max-height:86vh;overflow-y:auto;transform:translateY(105%);transition:transform .35s var(--ease);padding:8px 20px calc(24px + var(--bot))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--border-2);margin:4px auto 14px}
.sheet h3{font-size:20px;font-weight:700;letter-spacing:-.4px;line-height:1.3}
.sheet .sub{color:var(--ink-3);font-size:13px;margin-top:3px}
.sheet p{color:var(--ink-2);font-size:14px;line-height:1.7;margin-top:12px}
.sheet .acts{margin-top:16px}
.plan-day{border:1.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-top:10px}
.plan-day b{font-size:14.5px}
.plan-day small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.6;margin-top:3px}
.plan-day ol{margin:8px 18px 0 0;font-size:13px;color:var(--ink-2);line-height:1.8}
.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;margin-top:16px;box-shadow:0 8px 24px rgba(59,110,245,.3)}
.big-btn.ghost{background:var(--surface-2);color:var(--ink-2);box-shadow:none;margin-top:8px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--brand-light);border-top-color:var(--brand);animation:spin 1s linear infinite;margin:26px auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* viewer */
.viewer{position:fixed;inset:0;z-index:400;background:#000;display:flex;flex-direction:column}
.viewer[hidden]{display:none}
.viewer .stage{flex:1;position:relative;min-height:0}
.viewer video,.viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.viewer .x{position:absolute;top:calc(var(--top) + 12px);left:12px;z-index:3;background:rgba(255,255,255,.92);color:#111}
.viewer .cap{background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:16px 20px calc(16px + var(--bot));max-height:46vh;overflow-y:auto}
.viewer .cap h3{font-size:18px;font-weight:700}
.viewer .cap p{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-top:8px}
.viewer .cap ul{list-style:none;margin-top:10px}
.viewer .cap li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--ink-2)}
.viewer .cap li b{color:var(--ink);font-size:13.5px}
.viewer .cap li .ms{color:var(--brand);font-size:18px;margin-top:1px}

/* info screen */
.card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh-sm);margin-bottom:10px}
.flight{display:flex;align-items:center;gap:12px;margin-top:8px}
.flight .ap{font-size:24px;font-weight:700;letter-spacing:-.5px}
.flight .ap small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.flight .mid{flex:1;text-align:center;color:var(--ink-3);font-size:12px;position:relative}
.flight .mid::before{content:'';position:absolute;top:50%;left:0;right:0;border-top:1.5px dashed var(--border-2)}
.flight .mid span{position:relative;background:#fff;padding:0 8px}
.lbl{font-size:12px;color:var(--brand);font-weight:700}
.chk{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14.5px}
.chk:last-child{border:0}
.chk .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--border-2);display:grid;place-items:center;flex:0 0 auto;transition:.2s}
.chk.done .box{background:var(--brand);border-color:var(--brand)}
.chk.done .box::after{content:'✓';color:#fff;font-weight:700;font-size:13px}
.chk.done span{color:var(--ink-4);text-decoration:line-through}
.progress{height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin-bottom:6px}
.progress div{height:100%;background:var(--brand);transition:width .4s var(--ease)}
.tip{display:flex;gap:12px}
.tip .i{font-size:24px}
.tip b{font-size:15px}
.tip p{color:var(--ink-2);font-size:13.5px;line-height:1.6;margin-top:2px}
.ph{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--border)}
.ph:last-child{border:0}
.ph .hu{font-size:18px;direction:ltr;color:var(--brand);font-weight:600}
.ph small{color:var(--ink-3);font-size:12.5px}

/* bottom nav pill (Journi) */
.nav{position:fixed;left:0;right:0;bottom:calc(16px + var(--bot));z-index:200;display:flex;justify-content:center;pointer-events:none}
.nav .in{pointer-events:auto;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;padding:6px;gap:2px;box-shadow:0 4px 24px rgba(0,0,0,.14),0 1px 4px rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.7)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 15px;border-radius:999px;font-size:11px;font-weight:600;color:var(--ink-3);transition:.2s var(--ease)}
.nav button .ms{font-size:22px}
.nav button.on{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(59,110,245,.35)}
.nav button.on .ms{font-variation-settings:'FILL' 1}

.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + var(--bot));z-index:500;max-width:520px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:500;box-shadow:var(--sh-lg);transform:translateY(20px);opacity:0;pointer-events:none;transition:.3s var(--ease)}
.toast.on{transform:none;opacity:1}
</style>
</head>
<body>

<!-- ═══ SCHEDULE ═══ -->
<section class="screen on" id="s-plan">
  <div class="app-bar"><div class="wrap">
    <a href="../" class="circle" aria-label="כל הטיולים"><span class="ms">arrow_forward</span></a>
    <h1 id="tTitle"><small id="tDates"></small></h1>
  </div></div>
  <div class="wrap">
    <div class="hero" id="hero"></div>
    <button class="ai-btn" id="aiPlanBtn">
      <span class="ic"><span class="ms fill">auto_awesome</span></span>
      <span style="flex:1"><b id="aiPlanT">סידור חכם של הלו״ז</b><small id="aiPlanS">AI מסדר את המקומות שסימנתם ♥, מסביר למה, ואתם מאשרים</small></span>
      <span class="ms" style="color:var(--ink-4)">chevron_left</span>
    </button>
    <div class="sec"><h2>הלו״ז</h2><span id="planNote"></span></div>
    <div class="day-pills" id="dayPills"></div>
    <div id="day"></div>
  </div>
</section>

<!-- ═══ PLACES ═══ -->
<section class="screen" id="s-places">
  <div class="app-bar"><div class="wrap">
    <h1>המקומות שלנו<small id="plSub"></small></h1>
    <button class="circle" id="plAddReel" aria-label="הוספת ריל"><span class="ms">add_link</span></button>
  </div></div>
  <div class="wrap">
    <div id="pendingBox"></div>
    <label class="search"><span class="ms">search</span><input id="plSearch" type="search" placeholder="חיפוש מקום, מסעדה, בר..."></label>
    <div class="chips" id="plCats"></div>
    <div class="filters">
      <button class="chip" id="plFav"><span class="ms fill" style="font-size:16px;color:var(--rose)">favorite</span> שמרנו</button>
      <button class="chip" id="plRec">⭐ מומלצים</button>
      <button class="chip" id="plVid"><span class="ms fill" style="font-size:16px">smart_display</span> עם סרטון</button>
    </div>
    <div id="plList"></div>
  </div>
</section>

<!-- ═══ MAP (full screen) ═══ -->
<section class="screen" id="s-map">
  <div id="mapWrap"><div id="gmap"></div></div>
  <div class="map-top">
    <div class="seg" id="mapSeg">
      <button data-m="mine" class="on"><span class="ms">favorite</span>המקומות שלי</button>
      <button data-m="disc"><span class="ms">explore</span>גילוי</button>
    </div>
    <button class="circle" id="mapFit" aria-label="כל בודפשט"><span class="ms">my_location</span></button>
  </div>
  <div class="map-chips"><div class="chips" id="mapChips"></div></div>
  <div class="strip" id="strip"></div>
</section>

<!-- ═══ INFO ═══ -->
<section class="screen" id="s-info">
  <div class="app-bar"><div class="wrap"><h1>מידע<small>טיסות, מלון ורשימות</small></h1></div></div>
  <div class="wrap">
    <div class="sec"><h2>טיסות</h2></div><div id="flights"></div>
    <div class="sec"><h2>מלון</h2></div><div id="hotels"></div>
    <div class="sec"><h2>לפני שיוצאים</h2><span id="chkSub"></span></div>
    <div class="progress"><div id="chkBar"></div></div>
    <div class="card" id="checks" style="padding:4px 14px"></div>
    <div class="sec"><h2>טיפים</h2></div><div id="tips"></div>
    <div class="sec"><h2>הונגרית בסיסית</h2></div><div class="card" id="phrases" style="padding:4px 16px"></div>
  </div>
</section>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<div class="viewer" id="viewer" hidden>
  <div class="stage" id="vStage"><button class="circle x" id="vX" aria-label="סגירה"><span class="ms">close</span></button></div>
  <div class="cap" id="vCap"></div>
</div>
<div class="toast" id="toast"></div>

<nav class="nav"><div class="in" id="nav">
  <button data-s="info"><span class="ms">luggage</span>מידע</button>
  <button data-s="map"><span class="ms">travel_explore</span>מפה</button>
  <button data-s="places"><span class="ms">location_on</span>מקומות</button>
  <button data-s="plan" class="on"><span class="ms">calendar_month</span>לו״ז</button>
</div></nav>

<script src="trip.js"></script>
<script src="places.js"></script>
<script>
const T = window.TRIP;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
};
const WD = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'], WDF = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const MON = ['ינו׳', 'פבר׳', 'מרץ', 'אפר׳', 'מאי', 'יוני', 'יולי', 'אוג׳', 'ספט׳', 'אוק׳', 'נוב׳', 'דצמ׳'];
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) };
const fmt = s => { const d = D(s); return `${d.getDate()} ב${MON[d.getMonth()]}` };
const todayStr = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` })();
const gmapsUrl = (lat, lng, q) => lat ? `https://www.google.com/maps/search/?api=1&query=${lat},${lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/budapest|bp\b/g, '').replace(/[^a-z0-9֐-׿]+/g, ' ').trim();
const say = (t, ms = 5000) => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(say.t); say.t = setTimeout(() => el.classList.remove('on'), ms) };

/* ── server (ReelGlobe's Supabase) ── */
const RG = T.reelglobe || {}, RG_ON = !!(RG.api && RG.anonKey);
const H = { apikey: RG.anonKey, Authorization: 'Bearer ' + RG.anonKey, 'Content-Type': 'application/json' };
const BOX = { min_lat: 47.35, max_lat: 47.65, min_lng: 18.90, max_lng: 19.35 };
const api = async body => (await fetch(RG.api + '/functions/v1/trip', { method: 'POST', headers: H, body: JSON.stringify({ trip: 'budapest', ...body }) })).json();
let REELS = store.get('reels2', []), STATE = store.get('state', {});
async function loadServer() {
  if (!RG_ON) return;
  try {
    const [r, s] = await Promise.all([
      fetch(RG.api + '/rest/v1/rpc/trip_reels', { method: 'POST', headers: H, body: JSON.stringify({ ...BOX, lim: 800 }) }).then(x => x.ok ? x.json() : null),
      fetch(RG.api + '/rest/v1/trip_state?trip=eq.budapest&select=key,value', { headers: H }).then(x => x.ok ? x.json() : null),
    ]);
    if (r) { REELS = r; store.set('reels2', REELS) }
    if (s) { STATE = Object.fromEntries(s.map(x => [x.key, x.value])); store.set('state', STATE); if (Array.isArray(STATE.favs)) { favs = new Set(STATE.favs); store.set('favs2', [...favs]) } }
    rebuild();
  } catch {}
}

/* ── places: the list in places.js + what the reels add ── */
const CAT_MAP = { food: 'food', cafe: 'cafes', sight: 'sights', nature: 'sights', night: 'night', fun: 'fun', shop: 'shop', stay: 'fun', other: 'fun' };
let favs = new Set(store.get('favs2', Object.entries(store.get('favs', {})).filter(([, v]) => v).map(([k]) => k)));
let PL = [], DISC = [], GENERAL = [];
const keyOf = it => it.key || it.en || it.name;
function near(a, b, m = 150) { return a.lat && b.lat && Math.hypot(a.lat - b.lat, (a.lng - b.lng) * 0.67) * 111000 < m }
function sameName(it, s) {
  const a = norm(s.name_local || s.name_he); if (a.length < 4) return false;
  return [it.en, it.name].some(n => { const b = norm(n); return b.length >= 4 && (b.includes(a) || a.includes(b)) });
}
function rebuild() {
  PL = (window.PLACES || []).map(c => ({ ...c, items: c.items.map(it => ({ ...it, key: it.en || it.name, cat: c.id, reels: [] })) }));
  const all = () => PL.flatMap(c => c.items);
  const mineExtra = Array.isArray(STATE.adds) ? STATE.adds : [];
  // places they added from "discover"
  for (const a of mineExtra) {
    const c = PL.find(x => x.id === (CAT_MAP[a.category] || 'fun')) || PL[0];
    if (!all().some(it => it.key === a.key)) c.items.unshift({ key: a.key, name: a.name_he, en: a.name_local, desc: a.what_he || '', where: a.where_he, lat: a.lat, lng: a.lng, cat: c.id, reels: [], added: true });
  }
  DISC = []; GENERAL = [];
  for (const r of REELS) {
    const spots = r.ai ? (r.ai.places || []) : (r.place ? [{ name_he: r.title, name_local: String(r.place).split(',')[0], lat: r.lat, lng: r.lng, category: r.cat }] : []);
    if (!spots.length) { GENERAL.push(r); continue }
    for (const s of spots) {
      const hit = (s.match && all().find(it => it.key === s.match)) || all().find(it => sameName(it, s) || (s.precise && near(it, s, 60)));
      if (hit) { if (!hit.reels.some(x => x.r.id === r.id)) hit.reels.push({ r, note: s.what_he }); if (!hit.lat && s.lat && s.precise) { hit.lat = s.lat; hit.lng = s.lng } continue }
      const key = 'reel:' + norm(s.name_local || s.name_he);
      if (r.trip === 'budapest') {   // a reel they shared themselves: its places become theirs
        const c = PL.find(x => x.id === (CAT_MAP[s.category] || 'fun')) || PL[0];
        c.items.unshift({ key, name: s.name_he, en: s.name_local, desc: s.what_he || '', where: s.where_he, lat: s.lat, lng: s.lng, cat: c.id, reels: [{ r, note: s.what_he }], fromReel: true });
        continue;
      }
      let d = DISC.find(x => x.key === key || near(x, s, 50));
      if (!d) DISC.push(d = { key, name_he: s.name_he, name_local: s.name_local, what_he: s.what_he, where_he: s.where_he, lat: s.lat, lng: s.lng, category: s.category, reels: [] });
      if (!d.reels.some(x => x.r.id === r.id)) d.reels.push({ r, note: s.what_he });
    }
  }
  renderPlaces(); if (mapOn) drawMap();
}

/* ── hero + schedule ── */
$('#tTitle').insertAdjacentText('afterbegin', `${T.title} ${D(T.start).getFullYear()}`);
$('#tDates').textContent = `${fmt(T.start)} – ${fmt(T.end)} · ${T.travelers.join(' ו')}`;
function renderHero() {
  const now = new Date(), start = D(T.start), end = D(T.end); end.setHours(23, 59);
  const f = T.flights?.[0];
  if (f && f.dep) { const [h, m] = f.dep.split(':').map(Number); if (!isNaN(h)) start.setHours(h, m || 0) }
  let h;
  if (now < start) {
    const ms = start - now, d = Math.floor(ms / 864e5), hh = Math.floor(ms / 36e5) % 24, mm = Math.floor(ms / 6e4) % 60;
    h = `<div class="k">עד ההמראה לבודפשט</div><div class="big">${d ? `${d} ימים` : 'היום טסים!'}</div><div class="row">${[[d, 'ימים'], [hh, 'שעות'], [mm, 'דקות']].map(([n, l]) => `<div><b>${n}</b><small>${l}</small></div>`).join('')}</div>`;
  } else if (now <= end) {
    const n = T.days.findIndex(x => x.date === todayStr) + 1;
    h = `<div class="k">אנחנו בבודפשט!</div><div class="big">יום ${n || ''} מתוך ${T.days.length}</div>`;
  } else h = `<div class="k">היה מושלם</div><div class="big">בודפשט ${D(T.start).getFullYear()} 💛</div>`;
  $('#hero').innerHTML = h;
}
renderHero(); setInterval(renderHero, 30000);

let curDay = Math.max(0, T.days.findIndex(d => d.date === todayStr));
const planDay = date => STATE.plan?.days?.find(d => d.date === date);
const dayItems = d => planDay(d.date)?.items?.length ? planDay(d.date).items : d.items;
function renderPills() {
  $('#dayPills').innerHTML = T.days.map((d, i) => `
    <button class="day-pill ${i === curDay ? 'on' : ''} ${d.date === todayStr ? 'today' : ''}" data-i="${i}">
      <span class="n">${D(d.date).getDate()}.${D(d.date).getMonth() + 1}</span><span class="d">${WD[D(d.date).getDay()]}</span><span class="l">יום ${i + 1}</span>
    </button>`).join('');
}
function renderDay() {
  const d = T.days[curDay], pd = planDay(d.date), items = dayItems(d);
  $('#planNote').textContent = STATE.plan?.approved ? 'סודר ב-AI ואושר' : '';
  $('#aiPlanT').textContent = STATE.plan?.approved ? 'הלו״ז סודר ב-AI' : 'סידור חכם של הלו״ז';
  $('#aiPlanS').textContent = STATE.plan?.approved ? 'לראות את ההסבר, לסדר מחדש או לבטל' : 'AI מסדר את המקומות שסימנתם ♥, מסביר למה, ואתם מאשרים';
  $('#day').innerHTML = `
    <div class="day-head"><h3>${esc(pd?.title || d.title)}</h3><span>יום ${WDF[D(d.date).getDay()]}, ${fmt(d.date)}</span></div>
    ${pd?.why_he ? `<div class="info-block ib-ai"><div class="info-lbl"><span class="ms fill">auto_awesome</span>למה היום בנוי ככה</div>${esc(pd.why_he)}</div>` : ''}
    ${D(d.date).getDay() === 6 ? `<div class="info-block ib-nav"><div class="info-lbl"><span class="ms">synagogue</span>שבת</div>הכל ברגל ובקרבת המלון. צאת שבת בבודפשט בערך ב-17:00.</div>` : ''}
    ${items.length ? `<div class="timeline">${items.map((it, i) => `
      <div class="tl-item" style="animation-delay:${i * .04}s"><div class="tl-dot"></div>
        <div class="tl-card">
          <div class="tl-top"><span class="tl-time">${esc(it.t || '')}</span><span class="tl-emoji">${it.icon || '📍'}</span><span class="tl-name">${esc(it.name)}</span><span class="ms tl-chev">chevron_left</span></div>
          <div class="tl-body">
            ${it.desc ? `<div class="tl-desc">${esc(it.desc)}</div>` : ''}
            <div class="acts">${it.lat ? `<a class="act" target="_blank" rel="noopener" href="${gmapsUrl(it.lat, it.lng)}"><span class="ms">near_me</span>ניווט</a>` : ''}
              ${placeByKey(it.place) ? `<button class="act ghost" data-open="${esc(it.place)}"><span class="ms">info</span>על המקום</button>` : ''}</div>
          </div>
        </div></div>`).join('')}</div>`
    : `<div class="empty"><span class="ms">event_note</span><b>עוד אין תוכנית ליום הזה</b>מסמנים ♥ על מקומות ולוחצים על "סידור חכם" למעלה</div>`}`;
}
$('#dayPills').onclick = e => { const b = e.target.closest('.day-pill'); if (!b) return; curDay = +b.dataset.i; renderPills(); renderDay() };
$('#day').onclick = e => {
  const o = e.target.closest('[data-open]'); if (o) { const p = placeByKey(o.dataset.open); if (p) openPlace(p); return }
  if (e.target.closest('a,button')) return;
  e.target.closest('.tl-card')?.classList.toggle('open');
};
renderPills(); renderDay();
requestAnimationFrame(() => $('#dayPills .on')?.scrollIntoView({ inline: 'center', block: 'nearest' }));

/* ── AI schedule ── */
function sheet(html) { $('#sheetBody').innerHTML = html; $('#sheet').classList.add('on'); $('#sheetBg').classList.add('on'); $('#sheet').scrollTop = 0 }
function closeSheet() { $('#sheet').classList.remove('on'); $('#sheetBg').classList.remove('on') }
$('#sheetBg').onclick = closeSheet;
let draft = null;
function planHtml(p, approved) {
  return `<h3>${approved ? 'הלו״ז שאישרתם' : 'הצעה ללו״ז'}</h3><div class="sub">${approved ? 'אושר ' + new Date(p.approved).toLocaleDateString('he-IL') : 'עוד לא נשמר. עוברים, ואם מתאים מאשרים'}</div>
    <div class="info-block ib-ai" style="margin-top:14px"><div class="info-lbl"><span class="ms fill">auto_awesome</span>ההיגיון של הסידור</div>${esc(p.overview_he)}</div>
    ${p.days.filter(d => d.items?.length).map(d => `<div class="plan-day"><b>יום ${WDF[D(d.date).getDay()]} · ${esc(d.title)}</b><small>${esc(d.why_he || '')}</small>
      <ol>${d.items.map(it => `<li><b style="color:var(--brand)">${esc(it.t)}</b> ${it.icon || ''} ${esc(it.name)}</li>`).join('')}</ol></div>`).join('')}
    ${p.left_out_he ? `<div class="info-block ib-tip" style="margin-top:12px"><div class="info-lbl"><span class="ms">playlist_remove</span>מה נשאר בחוץ</div>${esc(p.left_out_he)}</div>` : ''}
    ${approved ? `<button class="big-btn" data-a="again"><span class="ms">refresh</span>לסדר מחדש</button><button class="big-btn ghost" data-a="undo">לבטל את הסידור</button>`
      : `<button class="big-btn" data-a="ok"><span class="ms">check</span>מאשרים את הסידור</button><button class="big-btn ghost" data-a="close">לא עכשיו</button>`}`;
}
async function makePlan() {
  const keys = [...favs];
  const base = new Set((window.PLACES || []).flatMap(c => c.items.map(it => it.en || it.name)));
  const extra = PL.flatMap(c => c.items).filter(it => favs.has(it.key) && !base.has(it.key)).map(it => ({ place: it.key, name: it.name, desc: it.desc, lat: it.lat, lng: it.lng }));
  if (!keys.length) return sheet(`<h3>קודם מסמנים ♥</h3><p>בעמוד המקומות לוחצים על הלב בכל מקום שבא לכם. ה-AI יסדר רק אותם.</p><button class="big-btn" data-a="places">למקומות</button>`);
  sheet(`<div class="spin"></div><h3 style="text-align:center">מסדר ${keys.length} מקומות…</h3><p style="text-align:center">בודק מרחקים, שעות פתיחה ושבת. זה לוקח בערך חצי דקה.</p>`);
  try {
    const f = T.flights || [];
    const o = await api({ plan: true, favs: keys.filter(k => base.has(k)), extra,
      days: T.days.map(d => ({ date: d.date, weekday: WDF[D(d.date).getDay()], title: d.title, fixed: d.items })),
      hotel: T.hotels[0], facts: `Hotel ${T.hotels[0]?.name}, ${T.hotels[0]?.addr}. Flights: ${f.map(x => `${x.dir} ${x.date} ${x.from}->${x.to} dep ${x.dep} arr ${x.arr}`).join('; ')}. Arrival day: they reach the hotel ~23:00, so nothing that evening. Last day: leave the hotel by 11:30.` });
    if (o.error || !o.plan) throw new Error(o.error || 'no plan');
    draft = o.plan; sheet(planHtml(draft, false));
  } catch (e) { sheet(`<h3>לא הצלחתי לסדר</h3><p>משהו השתבש בשרת (${esc(e.message)}). נסו שוב עוד רגע.</p><button class="big-btn" data-a="again">לנסות שוב</button>`) }
}
$('#aiPlanBtn').onclick = () => STATE.plan?.approved ? sheet(planHtml(STATE.plan, true)) : makePlan();
$('#sheet').addEventListener('click', async e => {
  const a = e.target.closest('[data-a]')?.dataset.a; if (!a) return;
  if (a === 'close') closeSheet();
  if (a === 'places') { closeSheet(); go('places') }
  if (a === 'again') makePlan();
  if (a === 'ok' && draft) {
    const p = { ...draft, approved: new Date().toISOString() };
    STATE.plan = p; store.set('state', STATE); closeSheet(); renderDay(); say('הלו״ז נשמר. פס תראה אותו גם');
    api({ approve: p }).catch(() => say('לא הצלחתי לשמור בשרת, נסו שוב'));
  }

function mapItems() {

function drawMap() {
  drawChips();

  for (const it of mapItems()) {
    const div = document.createElement('div');

    if (mapMode === 'disc') {

      div.innerHTML = `<div class="bub" style="${t ? `background-image:url('${esc(t)}')` : ''}">${t ? '' : r0?.video ? `<video muted playsinline preload="metadata" src="${esc(r0.video)}#t=0.5"></video>` : DCAT[it.category] || '📍'}</div>${it.reels.length > 1 ? `<span class="n">${it.reels.length}</span>` : ''}`;

function fitAll() {
  if (!GM) return;
  const pts = mapItems(); if (!pts.length) return GM.setCenter({ lat: T.center[0], lng: T.center[1] });
  const b = new google.maps.LatLngBounds(); pts.forEach(p => b.extend({ lat: p.lat, lng: p.lng }));
  GM.fitBounds(b, { top: 130, bottom: mapMode === 'disc' ? 240 : 110, left: 30, right: 30 });
}
function focusPlace(p) { if (!p) return; selKey = p.key; if (GM && p.lat) { GM.panTo({ lat: p.lat, lng: p.lng }); GM.setZoom(16); drawMap() } else if (!GM) drawFallback(p); openPlace(p) }
let HtmlMarker;
function initMap() {
  if (mapOn) return; mapOn = true;

  window.__gm = () => {
    HtmlMarker = class extends google.maps.OverlayView {
      constructor(it, div) { super(); this.it = it; this.div = div; this.setMap(GM) }
      onAdd() { this.getPanes().overlayMouseTarget.appendChild(this.div) }
      draw() { const p = this.getProjection().fromLatLngToDivPixel(new google.maps.LatLng(this.it.lat, this.it.lng)); if (p) { this.div.style.left = p.x + 'px'; this.div.style.top = p.y + 'px' } }
      onRemove() { this.div.remove() }
    };
    GM = new google.maps.Map($('#gmap'), {
      center: { lat: T.center[0], lng: T.center[1] }, zoom: 13, disableDefaultUI: true, gestureHandling: 'greedy', clickableIcons: false,
      restriction: { latLngBounds: { north: 47.75, south: 47.25, east: 19.45, west: 18.75 }, strictBounds: false }, minZoom: 11,
      styles: [{ featureType: 'poi', stylers: [{ visibility: 'off' }] }, { featureType: 'transit', elementType: 'labels.icon', stylers: [{ visibility: 'simplified' }] },
        { elementType: 'geometry', stylers: [{ saturation: -35 }, { lightness: 8 }] }, { featureType: 'water', stylers: [{ color: '#c9dcf7' }] }],
    });

// places in places.js without coordinates: looked up once, remembered on this phone
function geocodeMissing() {
  const cache = store.get('geo', {}), g = new google.maps.Geocoder();
  const todo = PL.flatMap(c => c.items).filter(it => !it.lat);
  todo.forEach(it => { if (cache[it.key]) Object.assign(it, cache[it.key]) });
  const left = todo.filter(it => !it.lat);
  const next = () => {
    const it = left.shift(); if (!it) return drawMap();
    g.geocode({ address: it.en || it.name, bounds: { north: 47.62, south: 47.40, east: 19.25, west: 18.92 } }, (r, st) => {

      setTimeout(next, 150);
    });
  };
  next();
  const orig = rebuild; rebuild = () => { orig(); PL.flatMap(c => c.items).forEach(it => { if (!it.lat && cache[it.key]) Object.assign(it, cache[it.key]) }); if (mapOn) drawMap() };
}

  if (b.dataset.s !== 'map') scrollTo({ top: 0 });
};
