<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>בודפשט</title>
<script>try{const t=JSON.parse(localStorage.getItem('theme'));document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="sched.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="טיולים">
<style>
/* Journi's look: light surfaces, one blue accent, soft shadows, pill controls */
:root{
  --bg:#F7F8FA;--surface:#fff;--surface-2:#F2F3F7;--surface-3:#EAECF2;--border:#E8EAF0;--border-2:#D8DBE6;
  --ink:#0D0E14;--ink-2:#3D3F52;--ink-3:#7E8099;--ink-4:#BABCCF;
  --brand:#3B6EF5;--brand-light:#EEF2FE;--brand-dark:#2952CC;
  --green:#22C55E;--green-light:#EDFBF3;--amber:#F59E0B;--amber-light:#FFFBEB;--rose:#F43F5E;--rose-light:#FFF1F3;--violet:#8B5CF6;--violet-light:#F5F3FF;
  --sh-sm:0 1px 3px rgba(13,14,20,.06),0 1px 2px rgba(13,14,20,.04);
  --sh-md:0 4px 16px rgba(13,14,20,.08),0 2px 6px rgba(13,14,20,.04);
  --sh-lg:0 16px 48px rgba(13,14,20,.12),0 4px 16px rgba(13,14,20,.06);
  --r-sm:10px;--r:16px;--r-lg:22px;--r-xl:28px;
  --ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
  --glass:rgba(255,255,255,.94);--on-ink:#fff;color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0E0F14;--surface:#181A22;--surface-2:#22252F;--surface-3:#2B2E3A;--border:#2A2D38;--border-2:#3A3E4C;
  --ink:#F2F3F7;--ink-2:#C9CBD8;--ink-3:#8E91A8;--ink-4:#5A5D70;
  --brand:#5B8CFF;--brand-light:rgba(91,140,255,.16);--brand-dark:#3B6EF5;
  --green-light:rgba(34,197,94,.13);--amber-light:rgba(245,158,11,.13);--rose-light:rgba(244,63,94,.16);--violet-light:rgba(139,92,246,.16);
  --sh-sm:0 1px 3px rgba(0,0,0,.35);--sh-md:0 4px 16px rgba(0,0,0,.4);--sh-lg:0 16px 48px rgba(0,0,0,.5);
  --glass:rgba(24,26,34,.92);--on-ink:#0E0F14;color-scheme:dark;
}
:root[data-theme=dark] .ai-btn{background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(59,110,245,.14))}
:root[data-theme=dark] .p-green,:root[data-theme=dark] .ib-tip .info-lbl{color:#4ade80}
:root[data-theme=dark] .p-amber{color:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:'Google Sans',system-ui,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle}
.ms.fill{font-variation-settings:'FILL' 1}

/* screens */
.screen{display:none;min-height:100vh;padding-bottom:calc(110px + var(--bot))}
.screen.on{display:block;animation:fadeUp .4s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

/* app bar (Journi) */
.app-bar{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:.5px solid var(--border);padding:calc(var(--top) + 10px) 0 10px}
.app-bar .wrap{display:flex;align-items:center;gap:10px}
.app-bar h1{font-size:20px;font-weight:700;letter-spacing:-.4px;flex:1}
.app-bar h1 small{display:block;font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-top:1px}
.circle{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center;color:var(--ink);flex:0 0 auto;transition:transform .12s}
.circle:active{transform:scale(.88)}
.app-bar .circle{box-shadow:none;background:var(--surface-2)}

/* hero card (countdown) */
.hero{margin:18px 0 6px;border-radius:var(--r-lg);padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#3B6EF5 0%,#5B8CFF 60%,#7FA6FF 100%);box-shadow:0 10px 30px rgba(59,110,245,.28)}
.hero::after{content:'';position:absolute;left:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .k{font-size:13px;opacity:.85}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.hero .row{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.hero .row div{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 4px;text-align:center}
.hero .row b{display:block;font-size:22px}
.hero .row small{font-size:11px;opacity:.9}

/* section header */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px}
.sec h2{font-size:17px;font-weight:700;letter-spacing:-.4px}
.sec span{font-size:13px;color:var(--ink-3)}

/* day pills (Journi) */
.day-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 20px 8px;margin:0 -20px}
.day-pills::-webkit-scrollbar{display:none}
.day-pill{flex:0 0 auto;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;text-align:center;min-width:64px;transition:all .2s var(--spring)}
.day-pill:active{transform:scale(.94)}
.day-pill .n{font-size:11px;color:var(--ink-4);display:block;font-weight:600}
.day-pill .d{font-size:16px;font-weight:700;color:var(--ink);display:block;margin:2px 0}
.day-pill .l{font-size:9px;color:var(--ink-3);display:block;font-weight:600}
.day-pill.on{background:var(--brand);border-color:var(--brand);box-shadow:0 6px 20px rgba(59,110,245,.28);transform:translateY(-2px)}
.day-pill.on *{color:#fff}
.day-pill.today:not(.on){border-color:var(--brand)}

.day-head{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.day-head h3{font-size:20px;font-weight:700;letter-spacing:-.4px;flex:1}
.day-head span{font-size:13px;color:var(--ink-3)}

/* AI button + info blocks */
.ai-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,#F5F3FF,#EEF2FE);border:1.5px solid rgba(139,92,246,.18);text-align:right;margin-top:14px}
.ai-btn .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#8B5CF6,#3B6EF5);color:#fff;flex:0 0 auto}
.ai-btn b{display:block;font-size:15px}
.ai-btn small{color:var(--ink-3);font-size:12.5px}
.info-block{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;line-height:1.65}
.info-lbl{font-size:11px;font-weight:700;letter-spacing:.4px;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.info-lbl .ms{font-size:16px}
.ib-nav{background:rgba(59,110,245,.05);border:1px solid rgba(59,110,245,.12);color:var(--ink-2)}
.ib-nav .info-lbl{color:var(--brand)}
.ib-ai{background:var(--violet-light);border:1px solid rgba(139,92,246,.18);color:var(--ink-2)}
.ib-ai .info-lbl{color:var(--violet)}
.ib-tip{background:var(--green-light);border:1px solid rgba(34,197,94,.18);color:var(--ink-2)}
.ib-tip .info-lbl{color:#15803d}

/* timeline (Journi) */
.timeline{position:relative;padding-right:26px}
.timeline::before{content:'';position:absolute;top:0;bottom:0;right:5px;width:2px;background:linear-gradient(180deg,var(--brand) 0%,rgba(59,110,245,.1) 100%);border-radius:2px}
.tl-item{position:relative;margin-bottom:6px;animation:slideIn .35s var(--ease) backwards}
@keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.tl-dot{position:absolute;right:-26px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--brand);box-shadow:0 0 0 3px rgba(59,110,245,.12);z-index:2}
.tl-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh-sm);transition:all .2s var(--ease)}
.tl-card.open{border-color:rgba(59,110,245,.35);box-shadow:0 0 0 4px rgba(59,110,245,.06),var(--sh-sm)}
.tl-top{display:flex;align-items:center;gap:10px}
.tl-time{font-size:12px;font-weight:700;color:var(--brand);min-width:40px;font-variant-numeric:tabular-nums}
.tl-emoji{font-size:19px;width:24px;text-align:center}
.tl-name{font-size:14.5px;font-weight:600;flex:1;line-height:1.35}
.tl-chev{color:var(--ink-4);transition:transform .25s}
.tl-card.open .tl-chev{transform:rotate(90deg);color:var(--brand)}
.tl-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.tl-card.open .tl-body{display:block;animation:expand .25s var(--ease)}
@keyframes expand{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tl-desc{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:99px;font-size:13px;font-weight:600;background:var(--brand-light);color:var(--brand)}
.act .ms{font-size:17px}
.act.ghost{background:var(--surface-2);color:var(--ink-2)}
.act.dark{background:var(--ink);color:var(--on-ink)}
.act.rose{background:var(--rose-light);color:var(--rose)}

/* empty */
.empty{text-align:center;padding:34px 20px;border:1.5px dashed var(--border-2);border-radius:var(--r-lg);color:var(--ink-3);font-size:13.5px;line-height:1.6;background:var(--surface)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty .ms{font-size:38px;color:var(--ink-4);margin-bottom:8px}

/* pills / chips */
.pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block}
.p-blue{background:var(--brand-light);color:var(--brand)}.p-green{background:var(--green-light);color:#15803d}
.p-amber{background:var(--amber-light);color:#b45309}.p-rose{background:var(--rose-light);color:var(--rose)}
.p-violet{background:var(--violet-light);color:var(--violet)}.p-gray{background:var(--surface-2);color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 20px 6px;margin:0 -20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--border);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

/* places */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:0 14px;margin:16px 0 12px}
.search input{flex:1;border:0;outline:0;background:none;padding:12px 0;font-size:15px;color:var(--ink)}
.search .ms{color:var(--ink-3)}
.filters{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.cat-h{display:flex;align-items:baseline;gap:8px;margin:24px 0 10px}
.cat-h h3{font-size:17px;font-weight:700;letter-spacing:-.3px}
.cat-h span{color:var(--ink-3);font-size:12.5px}
.pl{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh-sm);position:relative}
.pl h4{font-size:15.5px;font-weight:600;padding-left:44px;line-height:1.35}
.pl .en{direction:ltr;text-align:right;color:var(--ink-3);font-size:12px;margin-top:1px;padding-left:44px}
.pl p{color:var(--ink-2);font-size:13.5px;line-height:1.6;margin-top:7px}
.pl .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.fav{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);transition:transform .2s var(--spring)}
.fav.on{background:var(--rose-light);color:var(--rose)}
.fav:active{transform:scale(.85)}
.reel-row{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
.reel-row::-webkit-scrollbar{display:none}
.th{flex:0 0 auto;width:72px;height:108px;border-radius:12px;background:var(--surface-3) center/cover;position:relative;overflow:hidden;box-shadow:var(--sh-sm)}
.th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.th::after{content:'\e3d0';font-family:'Phosphor-Fill';font-size:24px!important;position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;text-shadow:0 1px 8px rgba(0,0,0,.5);font-variation-settings:'FILL' 1}
.th .src{position:absolute;bottom:4px;right:4px;z-index:1;font-size:9px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 5px}
.pending{background:var(--amber-light);border:1px solid rgba(245,158,11,.25);border-radius:var(--r);padding:12px 14px;margin-top:12px;font-size:13.5px}
.pending .r{display:flex;gap:8px;margin-top:8px}
.pending input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface);outline:0}

/* PLACES + MAP: one page; in map view the bar floats over a full-screen map */
#s-map .app-bar .wrap:last-child{display:block}
.tabs{display:flex;background:var(--surface-2);border-radius:99px;padding:4px;margin-top:10px}
.tabs button{flex:1;padding:8px 6px;border-radius:99px;font-size:14px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:5px;transition:.2s}
.tabs button .ms{font-size:18px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
body.mapmode #s-map{padding-bottom:0}
body.mapmode #s-map .app-bar{position:fixed;left:0;right:0}
.mapwrap{position:fixed;inset:0;background:var(--surface-3)}
.gm{width:100%;height:100%}
.gm iframe{width:100%;height:100%;border:0}
.ctl{position:fixed;top:calc(var(--top) + 72px);left:0;right:0;z-index:39;padding:0 12px;pointer-events:none}
.ctl > *{pointer-events:auto}
.ctl .chips{margin:0;padding:2px 0 6px}
.ctl .chip{box-shadow:0 2px 10px rgba(0,0,0,.12);border-color:transparent}
.mini{display:inline-flex;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:99px;padding:4px;box-shadow:var(--sh-md);margin-bottom:8px}
.mini button{display:flex;align-items:center;gap:4px;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.mini button .ms{font-size:16px}
.mini button.on{background:var(--brand);color:#fff}
.fabs{position:fixed;left:14px;bottom:calc(96px + var(--bot));z-index:39;display:flex;flex-direction:column;gap:10px}
.fabs .circle{width:46px;height:46px;background:var(--surface);box-shadow:var(--sh-md)}
.fabs .circle.on{color:#1a73e8}
.me{position:absolute;width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 7px rgba(26,115,232,.22);transform:translate(-50%,-50%);pointer-events:none;z-index:9}
/* DISCOVER */
#s-disc{padding:0;min-height:0}
.globe-note{position:fixed;top:calc(var(--top) + 72px);left:50%;transform:translateX(-50%);z-index:39;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2);box-shadow:var(--sh-md);white-space:nowrap}
.mk.seen{opacity:.55}
.mk.seen .bub{border-color:var(--ink-4)}
.feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#000}
.slide .poster{position:absolute;inset:0;background:#000 center/cover no-repeat}
.slide video,.slide iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;background:transparent;pointer-events:none}
.slide iframe.yt{height:calc(100% + 120px);top:-60px}
.slide .ov{position:absolute;left:0;right:0;bottom:0;padding:90px 16px calc(100px + var(--bot)) 78px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;pointer-events:none}
.slide .ov h3{font-size:18px;font-weight:700;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.slide .ov p{font-size:13.5px;line-height:1.6;margin-top:6px;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:auto}
.slide .ov p.open{-webkit-line-clamp:unset}
.slide .ov .where{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.slide .ov .where span{font-size:12px;font-weight:600;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:99px;padding:4px 10px}
.slide .side{position:absolute;left:12px;bottom:calc(108px + var(--bot));z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.slide .side > *{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center}
.slide .side .ms{font-size:26px}
.slide .side .on{color:var(--rose);background:#fff}
.slide .side .on .ms{font-variation-settings:'FILL' 1}
.slide.end{display:grid;place-items:center;text-align:center;color:#fff;padding:30px}
.slide.end .ms{font-size:52px;opacity:.7}
.slide.end b{display:block;font-size:20px;margin:10px 0 6px}
.slide.end p{opacity:.8;font-size:14px;line-height:1.6}
.vacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.viewer .cap li .pa{margin-right:auto;flex:0 0 auto;align-self:center}
.viewer .cap li .pa .ms{color:inherit}
.seg{flex:1;display:flex;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:99px;padding:5px;box-shadow:0 4px 24px rgba(0,0,0,.14)}
.seg button{flex:1;padding:9px 6px;border-radius:99px;font-size:14px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;justify-content:center;gap:5px;transition:.2s}
.seg button .ms{font-size:18px}
.seg button.on{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(59,110,245,.35)}

/* floating glass controls (like the bottom bar): page tabs + theme */
:root{--glass-f:rgba(255,255,255,.66);--glass-b:rgba(255,255,255,.55)}
:root[data-theme=dark]{--glass-f:rgba(28,30,38,.58);--glass-b:rgba(255,255,255,.08)}
.float-top{position:fixed;top:calc(var(--top) + 12px);left:12px;right:12px;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.float-top > *{pointer-events:auto}
.seg.icons,.float-top .circle,.glassy,.nav .in{background:var(--glass-f)!important;backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);border:1px solid var(--glass-b);box-shadow:0 4px 20px rgba(0,0,0,.12)}
.seg.icons{flex:0 0 auto;padding:4px;gap:2px}
.seg.icons button{width:54px;height:40px;padding:0;flex:0 0 auto}
.seg.icons button .ms{font-size:21px}
.seg.icons button:not(.on){color:var(--ink-2)}
.float-top .circle{color:var(--ink)}
#listView{padding-top:calc(var(--top) + 66px)}
.pl-sub{font-size:13px;color:var(--ink-3);margin:2px 2px 0}
.ctl-row{display:flex;align-items:center;gap:8px}
.ctl-row .chips{flex:1;min-width:0}
.chips.areas .chip{font-size:12.5px;padding:6px 11px}
.chips.areas .chip .ms{font-size:15px}
.ctl-row .circle{width:42px;height:42px;flex:0 0 auto;color:var(--brand)}
/* reels feed: tap = pause, double tap = like */
.slide .pp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2}
.slide .pp .ms{font-size:74px;color:rgba(255,255,255,.9);opacity:0;transform:scale(.8);transition:.2s;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.slide.paused .pp .ms{opacity:1;transform:none}
.slide .burst{position:absolute;z-index:4;pointer-events:none;font-size:110px;color:#ff3b5c;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:burst .9s var(--spring) forwards;filter:drop-shadow(0 6px 24px rgba(0,0,0,.35))}
@keyframes burst{15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}35%{transform:translate(-50%,-50%) scale(.95)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.slide .ov{transition:background .3s,padding .3s}
.slide .ov.open{background:linear-gradient(transparent,rgba(0,0,0,.6) 18%,rgba(0,0,0,.88));padding-top:160px}
.slide .side .on{color:#ff3b5c;background:rgba(255,255,255,.95)}
.mk.hl{z-index:20;transform:translate(-50%,-100%) scale(1.35)}
.mk.hl .bub{border-color:var(--brand);box-shadow:0 0 0 4px rgba(59,110,245,.35),0 6px 20px rgba(0,0,0,.35);animation:hl 1.4s ease-in-out infinite}
@keyframes hl{50%{box-shadow:0 0 0 10px rgba(59,110,245,.12),0 6px 20px rgba(0,0,0,.35)}}
/* icons: Phosphor (self-hosted), Material is the fallback */
@font-face{font-family:'Phosphor';src:url('fonts/Phosphor.woff2') format('woff2');font-display:block}
@font-face{font-family:'Phosphor-Fill';src:url('fonts/Phosphor-Fill.woff2') format('woff2');font-display:block}
.ms.phi{font-family:'Phosphor'!important;font-variation-settings:normal!important;width:1em;height:1em;line-height:1;overflow:visible;transform:translateY(-.08em)}
.ms.phi.fill,.on > .ms.phi,.act.rose .ms.phi,.fav.on .ms.phi{font-family:'Phosphor-Fill'!important}
/* markers */
.mk{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:transform .2s var(--spring)}
.mk:hover,.mk.sel{transform:translate(-50%,-100%) scale(1.15);z-index:5}
.mk .pin{width:34px;height:34px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);display:grid;place-items:center;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.mk.fv .pin{border-color:var(--rose);box-shadow:0 0 0 3px rgba(244,63,94,.25),0 3px 10px rgba(0,0,0,.25)}
.mk.rl .pin{border-color:var(--brand)}
.mk.hotel .pin{background:var(--brand);color:#fff;border-color:#fff}
.mk .bub{width:46px;height:58px;border-radius:12px;border:2.5px solid #fff;background:var(--brand) center/cover;box-shadow:0 4px 14px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-size:20px;overflow:hidden}
.mk .bub video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.mk .n{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}

/* bottom sheet */
.sheet-bg{position:fixed;inset:0;z-index:300;background:rgba(13,14,20,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:301;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-lg);max-height:86vh;overflow-y:auto;transform:translateY(105%);transition:transform .35s var(--ease);padding:8px 20px calc(24px + var(--bot))}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--border-2);margin:4px auto 14px}
.sheet h3{font-size:20px;font-weight:700;letter-spacing:-.4px;line-height:1.3}
.sheet .sub{color:var(--ink-3);font-size:13px;margin-top:3px}
.sheet p{color:var(--ink-2);font-size:14px;line-height:1.7;margin-top:12px}
.sheet .acts{margin-top:16px}
.plan-day{border:1.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-top:10px}
.plan-day b{font-size:14.5px}
.plan-day small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.6;margin-top:3px}
.plan-day ol{margin:8px 18px 0 0;font-size:13px;color:var(--ink-2);line-height:1.8}
.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;margin-top:16px;box-shadow:0 8px 24px rgba(59,110,245,.3)}
.big-btn.ghost{background:var(--surface-2);color:var(--ink-2);box-shadow:none;margin-top:8px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--brand-light);border-top-color:var(--brand);animation:spin 1s linear infinite;margin:26px auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* viewer */
.viewer{position:fixed;inset:0;z-index:400;background:#000;display:flex;flex-direction:column}
.viewer[hidden]{display:none}
.viewer .stage{flex:1;position:relative;min-height:0}
.viewer video,.viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.viewer .x{position:absolute;top:calc(var(--top) + 12px);left:12px;z-index:3;background:rgba(255,255,255,.92);color:#111}
.viewer .cap{background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:16px 20px calc(16px + var(--bot));max-height:46vh;overflow-y:auto}
.viewer .cap h3{font-size:18px;font-weight:700}
.viewer .cap p{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-top:8px}
.viewer .cap ul{list-style:none;margin-top:10px}
.viewer .cap li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--ink-2)}
.viewer .cap li b{color:var(--ink);font-size:13.5px}
.viewer .cap li .ms{color:var(--brand);font-size:18px;margin-top:1px}

/* info screen */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh-sm);margin-bottom:10px}
.flight{display:flex;align-items:center;gap:12px;margin-top:8px}
.flight .ap{font-size:24px;font-weight:700;letter-spacing:-.5px}
.flight .ap small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.flight .mid{flex:1;text-align:center;color:var(--ink-3);font-size:12px;position:relative}
.flight .mid::before{content:'';position:absolute;top:50%;left:0;right:0;border-top:1.5px dashed var(--border-2)}
.flight .mid span{position:relative;background:var(--surface);padding:0 8px}
.lbl{font-size:12px;color:var(--brand);font-weight:700}
.chk{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14.5px}
.chk:last-child{border:0}
.chk .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--border-2);display:grid;place-items:center;flex:0 0 auto;transition:.2s}
.chk.done .box{background:var(--brand);border-color:var(--brand)}
.chk.done .box::after{content:'✓';color:#fff;font-weight:700;font-size:13px}
.chk.done span{color:var(--ink-4);text-decoration:line-through}
.progress{height:6px;border-radius:9px;background:var(--surface-3);overflow:hidden;margin-bottom:6px}
.progress div{height:100%;background:var(--brand);transition:width .4s var(--ease)}
.tip{display:flex;gap:12px}
.tip .i{font-size:24px}
.tip b{font-size:15px}
.tip p{color:var(--ink-2);font-size:13.5px;line-height:1.6;margin-top:2px}
.ph{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--border)}
.ph:last-child{border:0}
.ph .hu{font-size:18px;direction:ltr;color:var(--brand);font-weight:600}
.ph small{color:var(--ink-3);font-size:12.5px}

/* bottom nav pill (Journi) */
.nav{position:fixed;left:0;right:0;bottom:calc(16px + var(--bot));z-index:200;display:flex;justify-content:center;pointer-events:none}
.nav .in{pointer-events:auto;display:flex;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;padding:6px;gap:2px;box-shadow:0 4px 24px rgba(0,0,0,.14),0 1px 4px rgba(0,0,0,.08);border:1px solid var(--border)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 15px;border-radius:999px;font-size:11px;font-weight:600;color:var(--ink-3);transition:.2s var(--ease)}
.nav button .ms{font-size:22px}
.nav button.on{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(59,110,245,.35)}
.nav button.on .ms{font-variation-settings:'FILL' 1}

.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + var(--bot));z-index:500;max-width:520px;margin:0 auto;background:var(--ink);color:var(--on-ink);border-radius:14px;padding:13px 16px;font-size:14px;font-weight:500;box-shadow:var(--sh-lg);transform:translateY(20px);opacity:0;pointer-events:none;transition:.3s var(--ease)}
.toast.on{transform:none;opacity:1}
</style>
</head>
<body>

</div><button class="nav-ai" id="navAi" aria-label="דונה, העוזרת של הטיול"></button></nav>

<script src="trip.js"></script>
<script src="places.js"></script>
<script>
/* icons: the Material names in the markup are drawn with Phosphor (nicer, rounder); unknown names stay Material */
const PH = {favorite:'\ue2a8',near_me:'\ueade',dark_mode:'\ue330',light_mode:'\ue472',auto_awesome:'\ue6a2',smart_display:'\ue792',map:'\ue31a',location_on:'\ue316',open_in_new:'\ue5de',my_location:'\ue1d6',chevron_left:'\ue138',zoom_out_map:'\ue0a2',view_list:'\ue2f2',synagogue:'\ue89e',search_off:'\ue30c',search:'\ue30c',refresh:'\ue036',public:'\ue28a',playlist_remove:'\ue2f4',luggage:'\ue9b0',info:'\ue2ce',hotel:'\ue0cc',explore:'\ue1c8',event_note:'\ue7b4',done_all:'\ue53a',close:'\ue4f6',check:'\ue182',calendar_month:'\ue10a',arrow_forward:'\ue06c',add_link:'\ue2e6',add:'\ue3d4',volume_off:'\ue45a',volume_up:'\ue44a',play_arrow:'\ue3d0',pause:'\ue39e',send:'\ue398',arrow_upward:'\ue08e',delete:'\ue4a6',smart_toy:'\ue762'};
function phIcons(root) {
  const list = root.classList?.contains('ms') ? [root] : root.querySelectorAll ? root.querySelectorAll('.ms') : [];
  for (const el of list) { const n = el.textContent.trim(); if (PH[n]) { el.dataset.i = n; el.classList.add('phi'); el.textContent = PH[n] } }
}
new MutationObserver(ms => { for (const m of ms) { const t = m.type === 'characterData' ? m.target.parentElement : m.target; if (t?.classList?.contains('ms')) phIcons(t); m.addedNodes?.forEach(n => n.nodeType === 1 && phIcons(n)) } })
  .observe(document.body, { childList: true, subtree: true, characterData: true });
phIcons(document.body);
const T = window.TRIP;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
};
const WD = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'], WDF = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const MON = ['ינו׳', 'פבר׳', 'מרץ', 'אפר׳', 'מאי', 'יוני', 'יולי', 'אוג׳', 'ספט׳', 'אוק׳', 'נוב׳', 'דצמ׳'];
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) };
const fmt = s => { const d = D(s); return `${d.getDate()} ב${MON[d.getMonth()]}` };
const todayStr = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` })();
const gmapsUrl = (lat, lng, q) => lat ? `https://www.google.com/maps/search/?api=1&query=${lat},${lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/budapest|bp\b/g, '').replace(/[^a-z0-9֐-׿]+/g, ' ').trim();
const say = (t, ms = 5000) => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(say.t); say.t = setTimeout(() => el.classList.remove('on'), ms) };

/* ── server (ReelGlobe's Supabase) ── */
const RG = T.reelglobe || {}, RG_ON = !!(RG.api && RG.anonKey);
const H = { apikey: RG.anonKey, Authorization: 'Bearer ' + RG.anonKey, 'Content-Type': 'application/json' };
const BOX = { min_lat: 47.35, max_lat: 47.65, min_lng: 18.90, max_lng: 19.35 };
const aiApi = async body => { const r = await fetch(RG.api + '/functions/v1/ai', { method: 'POST', headers: H, body: JSON.stringify({ trip: 'budapest', ...body }) }); const t = await r.text(); try { return JSON.parse(t) } catch { throw new Error('השרת לא ענה (' + r.status + ')') } };
const api = async body => (await fetch(RG.api + '/functions/v1/trip', { method: 'POST', headers: H, body: JSON.stringify({ trip: 'budapest', ...body }) })).json();
let REELS = store.get('reels2', []), STATE = store.get('state', {});
async function loadServer() {
  if (!RG_ON) return;
  try {
    const [r, s] = await Promise.all([
      fetch(RG.api + '/rest/v1/rpc/trip_reels', { method: 'POST', headers: H, body: JSON.stringify({ ...BOX, lim: 800 }) }).then(x => x.ok ? x.json() : null),
      fetch(RG.api + '/rest/v1/trip_state?trip=eq.budapest&select=key,value', { headers: H }).then(x => x.ok ? x.json() : null),
    ]);
    if (r) { REELS = r; store.set('reels2', REELS) }
    if (s) { STATE = Object.fromEntries(s.map(x => [x.key, x.value])); store.set('state', STATE); if (Array.isArray(STATE.favs)) { favs = new Set(STATE.favs); store.set('favs2', [...favs]) } }
    rebuild();
  } catch {}
}

/* ── places: the list in places.js + what the reels add ── */
const CAT_MAP = { food: 'food', cafe: 'cafes', sight: 'sights', nature: 'sights', night: 'night', fun: 'fun', shop: 'shop', stay: 'fun', other: 'fun' };
const catOf = c => (window.PLACES || []).some(x => x.id === c) ? c : (CAT_MAP[c] || 'fun');
let favs = new Set(store.get('favs2', Object.entries(store.get('favs', {})).filter(([, v]) => v).map(([k]) => k)));
let PL = [], GENERAL = [];
const keyOf = it => it.key || it.en || it.name;
const spotKey = s => 'reel:' + norm(s.name_local || s.name_he);
const relevant = r => !(r.ai && r.ai.relevant === false);
function near(a, b, m = 150) { return a.lat && b.lat && Math.hypot(a.lat - b.lat, (a.lng - b.lng) * 0.67) * 111000 < m }
function sameName(it, s) {   // only the very same name counts (a place on the same street is not the same place)
  const a = norm(s.name_local || s.name_he); if (a.length < 4) return false;
  return [it.en, it.name].some(n => norm(n) === a);
}
function rebuild() {
  PL = (window.PLACES || []).map(c => ({ ...c, items: c.items.map(it => ({ ...it, key: it.en || it.name, cat: c.id, area: (window.PLACE_AREAS || {})[it.en || it.name], reels: [] })) }));
  const all = () => PL.flatMap(c => c.items);
  const geo = store.get('geo', {});
  all().forEach(it => { if (!it.lat && geo[it.key]) Object.assign(it, geo[it.key]) });
  // places they added (from a reel)
  for (const a of Array.isArray(STATE.adds) ? STATE.adds : []) {
    const c = PL.find(x => x.id === catOf(a.category)) || PL[0];
    if (!all().some(it => it.key === a.key)) c.items.unshift({ key: a.key, name: a.name_he, en: a.name_local, desc: a.what_he || '', where: a.where_he, lat: a.lat, lng: a.lng, cat: c.id, reels: [], added: true });
  }
  GENERAL = [];
  for (const r of REELS) {
    if (!relevant(r)) continue;
    const spots = r.ai ? (r.ai.places || []) : [];
    if (!spots.length) { GENERAL.push(r); continue }
    const mine = r.trip === 'budapest', v2 = (r.ai?.v || 1) >= 2;
    for (const s of spots) {
      const hit = (s.match && all().find(it => it.key === s.match)) || all().find(it => sameName(it, s));
      // a place's card only gets videos that are really about it, not every list video that names it
      const about = mine || s.main || (v2 ? s.seen && spots.length <= 3 : spots.length <= 2);
      if (hit) { if (about && !hit.reels.some(x => x.r.id === r.id)) hit.reels.push({ r, note: s.what_he, main: s.main || mine }); if (!hit.lat && s.lat && s.precise) { hit.lat = s.lat; hit.lng = s.lng } continue }
      if (mine) {   // a reel they saved: its places become theirs
        const key = spotKey(s), c = PL.find(x => x.id === catOf(s.category)) || PL[0];
        const have = all().find(it => it.key === key);
        if (have) { if (!have.reels.some(x => x.r.id === r.id)) have.reels.push({ r, note: s.what_he }) }
        else c.items.unshift({ key, name: s.name_he, en: s.name_local, desc: s.what_he || '', where: s.where_he, lat: s.lat, lng: s.lng, cat: c.id, reels: [{ r, note: s.what_he, main: true }], fromReel: true });
      }
    }
  }
  all().forEach(it => it.reels.sort((a, b) => (b.r.trip === 'budapest') - (a.r.trip === 'budapest') || (b.main ? 1 : 0) - (a.main ? 1 : 0)));
  renderPlaces(); redrawMaps(); feedMore();
}

const reelKeys = r => PL.flatMap(c => c.items).filter(it => it.reels.some(x => x.r.id === r.id)).map(it => it.key);
function saveReel(r, quiet, force) {
  const on = force ?? r.trip !== 'budapest';
  if (on === (r.trip === 'budapest')) return;
  if (!on) reelKeys(r).forEach(k => favs.delete(k));
  r.trip = on ? 'budapest' : null; store.set('reels2', REELS); rebuild();
  const keys = on ? reelKeys(r) : [];
  keys.forEach(k => favs.add(k)); store.set('favs2', [...favs]);
  if (!quiet) say(on ? (keys.length ? `נשמר ♥ ${keys.length === 1 ? 'המקום נוסף' : keys.length + ' מקומות נוספו'} למקומות שלכם` : 'נשמר ♥') : 'הוסר מהמקומות שלכם');
  if (RG_ON) { STATE.favs = [...favs]; api({ favs: [...favs] }).catch(() => {}); api({ id: r.id, save: on }).catch(() => say('לא הצלחתי לשמור בשרת, נסו שוב')) }
  afterChange();
}
function addSpot(s) {
  if (!s) return;
  const key = spotKey(s);
  const adds = (Array.isArray(STATE.adds) ? STATE.adds : []).filter(x => x.key !== key);
  adds.push({ key, name_he: s.name_he, name_local: s.name_local, what_he: s.what_he, where_he: s.where_he, lat: s.lat, lng: s.lng, category: s.category });
  STATE.adds = adds; store.set('state', STATE); favs.add(key); store.set('favs2', [...favs]);
  if (RG_ON) { api({ adds }).catch(() => {}); STATE.favs = [...favs]; api({ favs: [...favs] }).catch(() => {}) }
  rebuild(); afterChange(); say(`"${s.name_he}" נוסף למקומות שלכם ♥`);
}
// the place a reel is about: its main place, else the first one we can put on the map
function reelPoint(r) {
  const sp = [...(r.ai?.places || [])].sort((a, b) => (b.main ? 1 : 0) - (a.main ? 1 : 0));
  for (const s of sp) {
    const p = s.match && placeByKey(s.match); if (p?.lat) return { lat: p.lat, lng: p.lng };
    if (s.lat && s.lat > 47.35 && s.lat < 47.65 && s.lng > 18.9 && s.lng < 19.35) return { lat: s.lat, lng: s.lng };
  }
  return r.precise ? { lat: r.lat, lng: r.lng } : null;
}
// Instagram file links from the hashtag search expire after about a day (oe= is the expiry, in hex seconds)
function playable(r) {
  if (r.source === 'youtube') return true;
  if (!r.video) return false;
  const oe = r.video.match(/[?&]oe=([0-9A-Fa-f]+)/); return !oe || parseInt(oe[1], 16) * 1000 > Date.now() + 6e5;
}

/* ── a reel: video + what the AI understood ── */

  else if (playable(r)) { el = document.createElement('video'); el.src = r.video; el.controls = true; el.playsInline = true; el.autoplay = true; if (r.thumb) el.poster = r.thumb }
  else { el = document.createElement('iframe'); el.src = `https://www.instagram.com/reel/${r.code}/embed/`; el.allow = 'autoplay; encrypted-media' }

}
function reelCaption(r) {

    ${(a.places || []).length ? `<ul>${a.places.map((s, i) => {
      const p = (s.match && all.find(it => it.key === s.match)) || all.find(it => it.key === spotKey(s));
      const btn = p ? `<button class="act ${favs.has(p.key) ? 'rose' : 'ghost'} pa" data-fav="${esc(p.key)}" style="padding:6px 10px"><span class="ms ${favs.has(p.key) ? 'fill' : ''}">favorite</span></button>`

}
function feedMore() {   // new videos that arrived: added at the end
  const f = $('#feed'); if (!f.children.length) return;
  const have = new Set(FEED.map(r => r.id)), add = REELS.filter(r => feedable(r) && !have.has(r.id));
  if (!add.length) return;
  FEED.push(...add);
  $('#feedEnd').insertAdjacentHTML('beforebegin', add.map(feedSlide).join(''));
  add.forEach(r => feedObs.observe(f.querySelector(`.slide[data-id="${CSS.escape(r.id)}"]`)));
}
function unmount(s) { const m = s.querySelector('.media'); if (m && m.firstChild) m.innerHTML = '' }
function feedStop() { clearTimeout(seenT); if (cur !== 'disc' || discTab !== 'feed') applyTheme(); document.querySelectorAll('#feed .slide .media').forEach(m => m.innerHTML = '') }
const ytCmd = (fr, func) => { try { fr.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*') } catch {} };
function feedActivate(s, force) {
  if (cur !== 'disc' || discTab !== 'feed') return;
  if (s === feedCur && !force) return;
  document.querySelectorAll('#feed .slide').forEach(x => x !== s && unmount(x));
  feedCur = s; clearTimeout(seenT); s.classList.remove('paused');
  if (s.id === 'feedEnd') { loadServer(); return }
  const r = REELS.find(x => x.id === s.dataset.id); if (!r) return;
  const box = s.querySelector('.media');
  if (!box.firstChild) {
    if (r.source === 'youtube') {
      box.innerHTML = `<iframe class="yt" allow="autoplay; encrypted-media" src="https://www.youtube.com/embed/${esc(r.code)}?autoplay=1&mute=1&playsinline=1&controls=0&loop=1&playlist=${esc(r.code)}&rel=0&modestbranding=1&enablejsapi=1"></iframe>`;
      const fr = box.firstChild; fr.onload = () => { if (!muted) setTimeout(() => ytCmd(fr, 'unMute'), 600) };
    } else {
      const v = document.createElement('video'); v.src = r.video; v.muted = muted; v.loop = true; v.playsInline = true; v.autoplay = true; if (r.thumb) v.poster = r.thumb;
      box.appendChild(v); v.play().catch(() => { v.muted = true; v.play().catch(() => {}) });
    }
  }
  const nx = s.nextElementSibling; if (nx?.dataset.id) { const n = REELS.find(x => x.id === nx.dataset.id); if (n && n.source !== 'youtube') { const l = document.createElement('link'); l.rel = 'preload'; l.as = 'video'; l.href = n.video; document.head.appendChild(l) } }
  seenT = setTimeout(() => markSeen(r), 1500);
}
function setMuted(m) {
  muted = m;
  document.querySelectorAll('#feed [data-fl="mute"] .ms').forEach(x => x.textContent = m ? 'volume_off' : 'volume_up');
  const box = feedCur?.querySelector('.media'); if (!box) return;
  const v = box.querySelector('video'); if (v) { v.muted = m; v.play().catch(() => {}) }
  const fr = box.querySelector('iframe'); if (fr) ytCmd(fr, m ? 'mute' : 'unMute');
}
function feedHearts() { document.querySelectorAll('#feed .slide[data-id]').forEach(s => { const r = REELS.find(x => x.id === s.dataset.id); s.querySelector('[data-fl="save"]')?.classList.toggle('on', r?.trip === 'budapest') }) }
let tapT = null, tapAt = 0;
function togglePause(s) {
  const box = s.querySelector('.media'), v = box.querySelector('video'), fr = box.querySelector('iframe');
  const pause = !s.classList.contains('paused');
  s.classList.toggle('paused', pause);
  if (v) pause ? v.pause() : v.play().catch(() => {});
  if (fr) ytCmd(fr, pause ? 'pauseVideo' : 'playVideo');
}
function burst(s, x, y) {
  const h = document.createElement('span'); h.className = 'ms burst fill'; h.textContent = 'favorite';
  const rc = s.getBoundingClientRect(); h.style.left = (x - rc.left) + 'px'; h.style.top = (y - rc.top) + 'px';
  s.appendChild(h); setTimeout(() => h.remove(), 950);
}
$('#feed').addEventListener('click', e => {
  const s = e.target.closest('.slide'); if (!s?.dataset.id) return;
  const r = REELS.find(x => x.id === s.dataset.id);
  const b = e.target.closest('[data-fl]');
  if (e.target.closest('a')) return;
  if (b) {
    if (b.dataset.fl === 'mute') setMuted(!muted);
    if (b.dataset.fl === 'save' && r) saveReel(r, true);
    if (b.dataset.fl === 'map' && r) { const pt = reelPoint(r); setDisc('globe'); openGlobe(pt, r.id) }
    return;
  }
  const now = Date.now();
  if (now - tapAt < 300) {                     // double tap: like (never unlikes, like Instagram)
    clearTimeout(tapT); tapAt = 0; burst(s, e.clientX, e.clientY); if (r) saveReel(r, true, true); return;
  }
  tapAt = now;
  const onText = e.target.closest('.ov p');
  tapT = setTimeout(() => { if (onText) { onText.classList.toggle('open'); onText.closest('.ov').classList.toggle('open', onText.classList.contains('open')) } else togglePause(s) }, 300);
});
$('#feed').addEventListener('dblclick', e => e.preventDefault());

/* ── the AI "watches" Instagram videos: this phone takes frames from the saved video and sends them ── */
const watchTried = new Set();
function grabFrames(src) {
  return new Promise(ok => {
    const v = document.createElement('video'), c = document.createElement('canvas'), out = [];
    let times = [];
    const done = () => { clearTimeout(t0); v.removeAttribute('src'); v.load(); ok(out) }, t0 = setTimeout(done, 30000);
    v.crossOrigin = 'anonymous'; v.muted = true; v.preload = 'auto'; v.playsInline = true;
    v.onloadedmetadata = () => { const d = isFinite(v.duration) ? v.duration : 10; times = [.06, .25, .45, .65, .85].map(f => f * d); v.currentTime = times.shift() };
    v.onseeked = () => {
      const w = 384, h = Math.round(w * (v.videoHeight || 16) / (v.videoWidth || 9)); c.width = w; c.height = h;
      try { c.getContext('2d').drawImage(v, 0, 0, w, h); out.push(c.toDataURL('image/jpeg', .72).split(',')[1]) } catch { return done() }
      times.length ? (v.currentTime = times.shift()) : done();
    };
    v.onerror = done; v.src = src;
  });
}
async function watchIG() {
  if (!RG_ON || document.hidden || watchIG.busy) return;
  const r = REELS.find(x => x.source === 'instagram' && x.ai && !x.ai.watched && playable(x) && !watchTried.has(x.id)); if (!r) return;
  watchIG.busy = true; watchTried.add(r.id);
  try {
    const frames = await grabFrames(r.video);
    if (frames.length >= 2) { const o = await api({ id: r.id, frames }); if (o.reel) { Object.assign(r, o.reel); store.set('reels2', REELS); rebuild() } }
  } catch {}
  watchIG.busy = false; setTimeout(watchIG, 4000);
}

/* ── info ── */
$('#flights').innerHTML = (T.flights || []).map(f => `
  <div class="card"><div class="lbl">${esc(f.dir)} · יום ${WDF[D(f.date).getDay()]}, ${fmt(f.date)} · ${esc(f.code)}</div>
    <div class="flight"><div class="ap">${esc(f.from)}<small>${esc(f.dep)}</small></div><div class="mid"><span>✈</span></div><div class="ap" style="text-align:left">${esc(f.to)}<small>${esc(f.arr)}</small></div></div></div>`).join('') || '<div class="card" style="color:var(--ink-3)">פרטי הטיסות יתעדכנו בקרוב.</div>';
$('#hotels').innerHTML = T.hotels.map(h => `<div class="card"><div class="lbl">${fmt(h.from)} – ${fmt(h.to)} · ${Math.round((D(h.to) - D(h.from)) / 864e5)} לילות</div>
  <div style="font-size:19px;font-weight:700;margin-top:4px">${esc(h.name)}</div><div style="color:var(--ink-3);font-size:13.5px;margin-top:2px">${esc(h.area)}</div>
  <div class="acts" style="margin-top:12px"><a class="act" target="_blank" rel="noopener" href="${gmapsUrl(h.lat, h.lng)}"><span class="ms">near_me</span>ניווט למלון</a></div></div>`).join('');
let done = store.get('checks', {});
function renderChecks() {
  const n = T.checklist.filter(c => done[c]).length;
  $('#chkSub').textContent = `${n} מתוך ${T.checklist.length}`; $('#chkBar').style.width = `${n / T.checklist.length * 100}%`;
  $('#checks').innerHTML = T.checklist.map(c => `<div class="chk ${done[c] ? 'done' : ''}" data-c="${esc(c)}"><div class="box"></div><span>${esc(c)}</span></div>`).join('');
}
$('#checks').onclick = e => { const r = e.target.closest('.chk'); if (!r) return; done[r.dataset.c] = !done[r.dataset.c]; store.set('checks', done); renderChecks() };
renderChecks();
$('#tips').innerHTML = T.tips.map(t => `<div class="card tip"><div class="i">${t.icon}</div><div><b>${esc(t.title)}</b><p>${esc(t.body)}</p></div></div>`).join('');
$('#phrases').innerHTML = T.phrases.map(p => `<div class="ph"><div><b style="font-size:14.5px">${esc(p.he)}</b><br><small>${esc(p.say)}</small></div><div class="hu">${esc(p.hu)}</div></div>`).join('');

/* ── navigation + the back gesture: closes what is open, then one page back (תמיד חוזרים ללו״ז לפני שיוצאים) ── */
let cur = 'plan', pendingGo = null;
const hs = () => history.state || { s: 'plan', l: [], d: 0 };
function show(s) {
  cur = s;
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.s === s));
  document.querySelectorAll('.screen').forEach(p => p.classList.toggle('on', p.id === 's-' + s));
  document.body.classList.toggle('mapmode', s === 'map' && view === 'map');
  if (s === 'map' && view === 'map') openMine();
  if (s === 'disc') setDisc(discTab); else feedStop();
  if (!(s === 'map' && view === 'map') && s !== 'disc') scrollTo({ top: 0 });
}
function hideLayers(keep = []) { if (!keep.includes('viewer') && !$('#viewer').hidden) hideViewer(); if (!keep.includes('sheet') && $('#sheet').classList.contains('on')) hideSheet() }
function pushLayer(name) { const st = hs(); if (!st.l.includes(name)) history.pushState({ ...st, l: [...st.l, name], d: st.d + 1 }, '') }
function closeLayer(name) { if (hs().l.includes(name)) history.back(); else name === 'sheet' ? hideSheet() : hideViewer() }
function go(s) {
  const d = hs().d; hideLayers();
  if (s === 'plan') { if (d) history.go(-d); else show('plan'); return }
  if (d === 0) { history.pushState({ s, l: [], d: 1 }, ''); show(s); return }
  if (d === 1) { history.replaceState({ s, l: [], d: 1 }, ''); show(s); return }
  pendingGo = s; history.go(-(d - 1));
}
addEventListener('popstate', () => {
  const st = hs();
  if (pendingGo) { const s = pendingGo; pendingGo = null; history.replaceState({ s, l: [], d: 1 }, ''); hideLayers(); show(s); return }
  hideLayers(st.l);
  if (st.s !== cur) show(st.s);
});
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.s !== cur) go(b.dataset.s) };
if (!history.state) history.replaceState({ s: 'plan', l: [], d: 0 }, ''); else if (hs().s !== 'plan') show(hs().s);
applyTheme(); rebuild(); loadServer();
setTimeout(watchIG, 8000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadServer(); setTimeout(watchIG, 5000) } else feedStop() });
</script>
